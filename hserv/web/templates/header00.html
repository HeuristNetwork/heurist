<header class="" style="background-image: url(&quot;{$header.bgImage}&quot;) !important; background-repeat: repeat-x !important; background-size: auto 100%;"> 
    <div class="container">
        <nav>
            <div class="container-fluid">
            
            <div class="d-flex align-items-center">
                <img src="{$header.logo}" alt="Logo" height="40">
                <h5>{$header.title}</h5>
            </div>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-navbar" focusable="false">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div id="main-navbar" class="collapse navbar-collapse justify-content-end">

                <!-- main menu -->
                <div id="main-menu" data-heurist-widget="HMenu">{$header.navbar}</div>
                
                <div class="d-flex ms-lg-3">
                    <!-- language selector -->
                    {$header.languages} 
                    
                    <!-- login/signup and personal menu -->
                    <div data-heurist-widget="HMenuPersonal"></div>
                </div>
            </div>
            </div>   
        </nav>
    </div>
</header>
