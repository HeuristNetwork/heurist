        <style>
            .ft_col{
                display:inline-block;
                width:45%;
                vertical-align:top;
                padding-left:10px;
                min-width:280px;
            }
            .ft_col > h2{
                padding-bottom:1em;
                margin:0px;
            }
            .ft_col > label{
                color: black; 
                /*#6A7C99;*/
                font-weight:bold;
                font-size: 13px;
                line-height: 25px;
                padding-top:1em;
                padding-left:0.5em;
            }
            .ft_notes{
                padding-left:2em;
                padding-bottom:1em;
            }               
        </style>

<div style="width:98%;height:90%;padding:10px 10px 0px 0;overflow:hidden">
    <div class="ft_col">

        <h2 style="color:black">Simple fields</h2>

        <input type="radio" name="ft_type" id="t_enum" value="enum" checked>
        <label for="t_enum">Dropdown (Terms)</label>
        <div class="ft_notes">
            <span data-translate="fieldDesc_enum"></span>
        </div>

        <input type="radio" name="ft_type" id="t_numeric" value="float">
        <label for="t_numeric">Numeric (integer or decimal)</label>
        <div class="ft_notes">
            <span data-translate="fieldDesc_numeric"></span>
        </div>

        <input type="radio" name="ft_type" id="t_freetext" value="freetext">
        <label for="t_freetext">Text (single line)</label>
        <div class="ft_notes">
            <span data-translate="fieldDesc_freetext"></span>
        </div>

        <input type="radio" name="ft_type" id="t_blocktext" value="blocktext">
        <label for="t_blocktext">Text (multi line)</label>                                                         
        <div class="ft_notes">
            <span data-translate="fieldDesc_blocktext"></span>
        </div>

        <input type="radio" name="ft_type" id="t_date" value="date">
        <label for="t_date">Date / time</label>
        <div class="ft_notes">
            <span data-translate="fieldDesc_datetime"></span>
        </div>

    </div>

    <div class="ft_col">
        <h2 style="color:black">Special fields</h2>

        <input type="radio" name="ft_type" id="t_geo" value="geo">
        <label for="t_geo">Geospatial (point, line, polygon ...)</label>
        <div class="ft_notes">
            <span data-translate="fieldDesc_geo"></span>
        </div>

        <input type="radio" name="ft_type" id="t_file" value="file">
        <label for="t_file">File or remote URL</label>
        <div class="ft_notes">
            <span data-translate="fieldDesc_file"></span>
        </div>

        <h2 style="color:black">Record linking fields</h2>

        <input type="radio" name="ft_type" id="t_resourse" value="resource">
        <label for="t_resourse">Record pointer</label>                                                         
        <div class="ft_notes">
            <span data-translate="fieldDesc_resource"></span>
            <a data-helper="field_data_types #resource" style="cursor: pointer;">more...</a>
        </div>


        <input type="radio" name="ft_type" id="t_relmarker" value="relmarker">
        <label for="t_relmarker">Relationship marker</label>                                                         
        <div class="ft_notes">
            <span data-translate="fieldDesc_relmarker"></span>
            <a data-helper="field_data_types #relmarker" style="cursor: pointer;">more...</a>
        </div>

    </div>

</div>
