<div>
    <div class="sub-title"></div>
    <div style="position: absolute;left: 10px;bottom: 0px;width: 12em;">
        <div class="btn_AddRecord"></div>
        <div id="btn_find_record" style="margin-top:4px"></div>
    </div>

    <div>
        <div style="display:inline-block;padding:0.2em">
            <div class="header4" style="display: inline-block;width:8em;text-align:right;">
                <label for="input_search">Find by Name</label></div>
            <input id="input_search" class="text ui-widget-content ui-corner-all" 
                style="width: 130px; margin-right:0.2em"/>
        </div>

        <div style="display:inline-block;padding:0.2em">
            <div class="header4" style="display: inline-block;text-align:right;width:8em">
                <label for="input_search_inactive">Inactive</label></div>
            <input id="input_search_inactive" type="checkbox" class="text ui-widget-content ui-corner-all" 
                style="margin-right:0.2em"/>
        </div>

        <div style="display:inline-block;padding:0.2em" id="input_sort_type_div">
            <div class="header4" style="display: inline-block;width:4em;text-align:right;">
                <label for="input_sort_type">Sort by</label></div>
            <select id="input_sort_type" class="text ui-widget-content ui-corner-all" 
                style="width:90px; margin-right:0.2em">
                    <option value="name">User Name</option>            
                    <option value="lastname">Last Name</option>
                    <option value="recent">Recent</option>
            </select>
        </div>
        
        <div id="btn_search_start" style="display:inline-block;"></div>   
    </div>    
    
    <div>
        <div style="display:inline-block;padding:0.2em">
            <div class="header4" style="display: inline-block;width:8em;text-align:right;">
                <label for="input_search_group">in Group</label></div>
            <select id="input_search_group" class="text ui-widget-content ui-corner-all" 
                style="width: 130px; margin-right:0.2em"></select>
        </div>
        <div style="display:inline-block;padding:0.2em" id="input_search_type_div">
            <div class="header4" style="display: inline-block;width:8em;text-align:right;">
                <label for="input_search_role">Role</label></div>
            <select id="input_search_role" class="text ui-widget-content ui-corner-all" 
                style="width: 130px; margin-right:0.2em">
                    <option value="any">any</option>            
                    <option value="admin">admin</option>
                    <option value="member">member</option>
            </select>
        </div>
