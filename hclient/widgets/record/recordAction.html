<div id="div_header" style="padding: 0.2em; width: 100%;">

</div>

<fieldset id="div_fieldset"><legend style="display:none"></legend>
    <div style="padding: 0.2em; width: 100%;" class="input">
        <div class="header" style="padding: 0 16px 0 16px;">
            <label for="sel_record_scope">Records scope:</label>
        </div>
        <select id="sel_record_scope" class="text ui-widget-content ui-corner-all" style="width:300px;max-width:40em"></select>
    </div>
</fieldset>

<div id="div_result" class="ent_wrapper" style="display: none;">
    RESULT
</div>

<div class="ent_wrapper progressbar_div" style="display: none; background:white">
        <div class="loading" style="display:none;height:100%"></div>
        <div style="width:80%;height:40px;padding:5px;text-align:center;margin:auto;margin-top:20%;">
            <div id="progressbar">
                <div class="progress-label">Processing data...</div>
            </div>
            <div class="progress_stop" style="text-align:center;margin-top:4px">Abort</div>
        </div>
</div>
