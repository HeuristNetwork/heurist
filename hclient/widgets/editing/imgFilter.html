<div>
        
        <label><span>blur</span>
            <div><span style="float:right;">0</span><input type="range" min="0" max="10" value="0" step="0.1" name="blur" data-suffix="px" style="width:90%"></div>
        </label>
        <label><span>brightness</span>
            <div><span style="float:right;">1</span><input type="range" min="0" max="3" value="1" step="0.1" name="brightness" style="width:90%"></div>
        </label>
        <label><span>contrast</span>
            <div><span style="float:right;">1</span><input type="range" min="0" max="3" value="1" step="0.1" name="contrast" style="width:90%"></div>
        </label>
        <label><span>grayscale</span>
            <div><span style="float:right;">0</span><input type="range" min="0" max="1" value="0" step="0.01" name="grayscale" style="width:90%"></div>
        </label>
        <label><span>hue-rotate</span>
            <div><span style="float:right;">0</span><input type="range" min="0" max="360" value="0" name="hue-rotate" data-suffix="deg" style="width:90%"></div>
        </label>
        <label><span>invert</span>
            <div><span style="float:right;">0</span><input type="range" min="0" max="1" value="0" step="0.01" name="invert" style="width:90%"></div>
        </label>
        <label><span>opacity</span>
            <div><span  style="float:right;">1</span><input type="range" min="0" max="1" value="1" step="0.01" name="opacity" style="width:90%"></div>
        </label>
        <label><span>saturate</span>
            <div><span  style="float:right;">1</span><input type="range" min="0" max="3" value="1" step="0.1" name="saturate" style="width:90%"></div>
        </label>
        <label><span>sepia</span>
            <div><span style="float:right;">0</span><input type="range" min="0" max="1" step="0.01" value="0" name="sepia" style="width:90%"></div>
        </label>
        <label><span>transparent color</span>
            <div><input type="text" name="transparentColor" value="" style="max-width:130px"></div>
        </label>
</div>
