* It includes input fields for searching ESTC Work records (Heurist Record Type 49)
* based on criteria like Work Name, Project ID, Helsinki Name, and Helsinki ID.
* It also provides a dropdown for selecting the sort order of results.

* @since       6.0

<div id="ent_header" style="height:9em; padding: 0.2em; width: 99%;" class="input">
    <fieldset style="float: left;"><legend style="display:none"></legend>
        <div style="padding: 0.2em; width: 100%;" class="input">
            <div class="header" style="padding: 0px 16px; width: 85px; min-width: 85px;">
                <label for="work_name">Work Name:</label>
            </div>
            <input id="work_name" class="text ui-widget-content ui-corner-all search_on_enter" style="max-width:240px;min-width:240px;">

            <div class="header" style="padding: 0px 16px; width: 85px; min-width: 85px;">
                <label for="project_id">Project Work ID:</label>
            </div>
            <input id="project_id" class="text ui-widget-content ui-corner-all search_on_enter" style="max-width:30em">

        </div>
        <div style="padding: 0.2em; width: 100%;" class="input">

            <div class="header" style="padding: 0px 16px; width: 85px; min-width: 85px;">
                <label style="padding-left: 1.4em;" for="helsinki_name">Helsinki Work Name:</label>
            </div>
            <input id="helsinki_name" class="text ui-widget-content ui-corner-all search_on_enter" style="max-width:240px;min-width:240px;">

            <div class="header" style="padding: 0px 16px; width: 85px; min-width: 85px;">
                <label for="helsinki_id">Helsinki Work ID:</label>
            </div>
            <input id="helsinki_id" class="text ui-widget-content ui-corner-all search_on_enter" style="max-width:30em;">
        </div>

        <div style="padding: 0.2em; width: 100%;" class="input">
            <div class="header" style="padding: 0px 16px; width: 85px; min-width: 85px;">
                <label style="padding-left: 1.4em;" for="sort_by_field">Sort by:</label>
            </div>
            <select id="sort_by_field" class="text ui-widget-content ui-corner-all" style="max-width:130px">
                <option value="1">Title</option>
                <option value="276">Extended Title</option>
                <option value="271">Project Record ID</option>
                <option value="273">Helsinki Work Name</option>
            </select>
        </div>
    </fieldset>

    <div style="display: inline-block;">
        <div style="display:grid;height:inherit;padding:7px;" class="input">
            <button id="btnStartSearch"  style="border: 2.0px solid #95A7B7;" class="ui-button ui-corner-all ui-widget">Search</button>
        </div>
    </div>
</div>

<div id="div_result" class="ent_content_full" style="display: none;top:10.5em">
</div>
