<!-- Search Container -->
<div id="ent_header" style="height:7em; padding: 0.2em; width: 99%;">
    <fieldset style="display: block;" id="search_container"><legend style="display:none"></legend>

        <div style="padding: 0.2em; width: 100%;" class="input" id="query_form">

            <div>
                <div class="header recommended">
                    <label for="inpt_any">Nomisma ID:</label>
                </div>
                <input id="inpt_any" class="text ui-widget-content ui-corner-all" style="max-width:30em;"/>
            </div>

    </fieldset>

    <div style="display: block;" id="btn_container">
        <button id="btnMintSearch" value="mint">Search Mint</button>
        <button id="btnHoardsSearch" value="hoard">Search Hoards</button>
        <button id="btnFindspotsSearch" value="findspots">Search Findspots</button>
        <button id="btnRdfSearch" value="getRdf">Get RDF</button>
    </div>
</div>

<!-- Result List Container -->
<div id="div_result" class="ent_content_full" style="display: none;top:9em">
</div>
