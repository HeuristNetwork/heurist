<!--
/**
* lookupLRC18C.html - HTML structure for LRC18C ESTC Import Lookup.
*
* @fileOverview
* This HTML file defines the layout and form elements for the
* "Libraries, Readers, Culture of the 18th Century Atlantic" (LRC18C) ESTC import widget.
* It includes input fields for searching ESTC Edition records (e.g., by edition name,
* date, author, work, place, ESTC No.), a dropdown for book format, and a sort order selector.
* This structure is utilized by the `heurist.lookupLRC18C` jQuery UI widget, which
* primarily uses this interface to find records in the ESTC database for import.
*
* @package     Heurist academic knowledge management system
* @subpackage  hclient\widgets\lookup

* @license     https://www.gnu.org/licenses/gpl-3.0.txt GNU License 3.0
* @author      Artem Osmakov <osmakov@gmail.com>
* @author      Darshan Nagavara <darshan@intersect.org.au>
* @author      Ian Johnson <ian.johnson.heurist@gmail.com>
* @since       4.0
*/
-->
<div id="ent_header" style="height:12em; padding: 0.2em; width: 99%;" class="input">
    <fieldset style="display:inline-block"><legend style="display:none"></legend>

        <div style="padding: 0.2em; width: 100%;" class="input">
            <div class="header" style="padding: 0px 16px; width: 80px; min-width: 80px;">
                <label for="edition_name">Edition Name:</label>
            </div>
            <input id="edition_name" class="text ui-widget-content ui-corner-all search_on_enter" style="max-width:30em">
            <div class="header" style="padding: 0px 16px; width: 80px; min-width: 80px;">
                <label for="edition_work">Work ID:</label>
            </div>
            <input id="edition_work" class="text ui-widget-content ui-corner-all search_on_enter" style="max-width:30em">

            <div class="header" style="padding: 0px 16px; width: 80px; min-width: 80px;">
                <label for="edition_date">Year of first vol:</label>
            </div>
            <input id="edition_date" class="text ui-widget-content ui-corner-all search_on_enter" style="max-width:30em">

        </div>

        <div style="padding: 0.2em; width: 100%;" class="input">
            <div class="header" style="padding: 0px 16px; width: 80px; min-width: 80px;">
                <label for="edition_author">Author:</label>
            </div>
            <input id="edition_author" class="text ui-widget-content ui-corner-all search_on_enter" style="max-width:30em">

            <div class="header" style="padding: 0px 16px; width: 80px; min-width: 80px;">
                <label for="edition_date">Place of publication:</label>
            </div>
            <input id="edition_place" class="text ui-widget-content ui-corner-all search_on_enter" style="max-width:30em">

            <div class="header" style="padding: 0 16px 0 16px;">
                <label for="select_bf">Book Format:</label>
            </div>
            <select id="select_bf" class="text ui-widget-content ui-corner-all" style="max-width:130px"></select>
        </div>

        <div style="padding: 0.2em; width: 100%;" class="input">
            
            <div class="header" style="padding: 0px 16px; width: 100px; min-width: 80px;">
                <label style="padding-left: 1.4em;" for="estc_no">ESTC No:</label>
            </div>
            <input id="estc_no" class="text ui-widget-content ui-corner-all search_on_enter" style="max-width:30em;">
            

            <div class="header" style="padding: 0px 16px; width: 80px; min-width: 80px;">
                <label for="vol_count">Volume Count:</label>
            </div>
            <input id="vol_count" class="text ui-widget-content ui-corner-all search_on_enter" style="max-width:30em;">
            
            <div class="header" style="padding: 0px 16px; width: 80px; min-width: 80px;">
                <label for="vol_parts">Volume Parts:</label>
            </div>
            <input id="vol_parts" class="text ui-widget-content ui-corner-all search_on_enter" style="max-width:30em;">
        </div>

        <div style="padding: 0.2em; width: 100%;" class="input">
            <div class="header" style="padding: 0px 16px; width: 85px; min-width: 85px;">
                <label style="padding-left: 1.4em;" for="sort_by_field">Sort by:</label>
            </div>
            <select id="sort_by_field" class="text ui-widget-content ui-corner-all" style="max-width:130px">
                <option value="1">Title</option>
                <option value="9">Year of First Volume</option>
                <option value="275">Year of Final Volume</option>
                <option value="256">Book Format</option>
            </select>
        </div>
    </fieldset>

    <div style="display: grid;position: absolute; top: 115px; right: 85px;width: 120px;" class="input">
        <button id="btnStartSearch"  style="border: 2.0px solid #95A7B7;" class="ui-button ui-corner-all ui-widget">Search</button>
    </div>
</div>

<div id="div_result" class="ent_content_full" style="display: none;top:14em">
</div>
