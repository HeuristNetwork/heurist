<fieldset class="hf-fieldset"><legend style="display:none"></legend>
    <div style="width: 100%;" class="input">
        <div class="header">
            <label for="letter_name" class="slocale">Your name</label>
        </div>
        <input type="text" id="letter_name" required="required" placeholder="e.g. Jane Doe" aria-required="true" size="50">
    </div>
    
    <div style="width: 100%;" class="input">
        <div class="header">
            <label for="letter_email" class="slocale">Email Address</label>
        </div>
        <input type="email" id="letter_email" required="required" placeholder="e.g. jane.doe@example.com" aria-required="true" size="50">
    </div>

    
    <div style="align-items: flex-start;width: 100%;" class="input">
        <div class="header">
            <label for="letter_content" class="slocale">Email Message</label>
        </div>
        <textarea id="letter_content"  required="required" style="height:150px"></textarea>
    </div>
    
    
    <div class="input hf-captcha" style="width: 100%;">
        <div class="header">
            <label for="captcha" class="slocale">Prove you are human</label>
        </div>
        <div id="captcha_img"></div>
        <input type="text" name="captcha" id="captcha" maxlength="16" />
        <input type="hidden" name="captchaid" id="captchaid"/>
    </div>
    
</fieldset>
