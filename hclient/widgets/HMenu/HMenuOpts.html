<fieldset id="tab-setup"><legend style="display:none"></legend>

        <!-- appearance -->
        <div>
            <div class="header header_wide">
                Orientation
            </div>
            <select name="viewMode" class="text ui-widget-content" style="min-width:50px">
                <option value="horizontal">horizontal</option>
                <option value="vertical">vertical</option>
                <option value="treeview">treeview</option>
            </select>
        </div>
        <div>
            <div class="header header_wide">
                Style
            </div>
            <select name="viewMode" class="text ui-widget-content" style="min-width:50px">
                <option value="links">links</option>
                <option value="pills">pills</option>
            </select>
        </div>
        <div>
            <div class="header header_wide">
                On loading
            </div>
            <select name="expandLevels" class="text ui-widget-content" style="min-width:50px">
                <option value="0">Show first level only</option>
                <option value="1">Open second level</option>
                <option value="2">Open all levels</option>
            </select>
        </div>
</fieldset>

        <div>

                Widget label
