<fieldset id="tab-setup"><legend style="display:none"></legend>

        <div id="menuItems"></div>

        <!-- appearance -->
        <div>
            <div class="header header_wide">
                Orientation
            </div>
            <select name="viewMode" class="text ui-widget-content" style="min-width:200px">
                <option value="horizontal">horizontal</option>
                <option value="vertical">vertical</option>
                <option value="treeview">treeview</option>
            </select>
        </div>
        <div>
            <div class="header header_wide">
                Style
            </div>
            <select name="styleMode" class="text ui-widget-content" style="min-width:200px">
                <option value="links">links</option>
                <option value="pills">pills</option>
            </select>
        </div>
        <div>
            <div class="header header_wide">
                On loading
            </div>
            <select name="expandLevels" class="text ui-widget-content" style="min-width:200px">
                <option value="0">Show first level only</option>
                <option value="1">Open second level</option>
                <option value="2">Open all levels</option>
            </select>
        </div>
        <span style="min-height:5rem;display:block"></span>
</fieldset>

        
<fieldset id="tab-connect"><legend style="display:none"></legend>

        <div>
            <div class="header header_narrow">
                HTML (DOM) ID
            </div>

            <input name="dom_id" class="text ui-widget-content"/>
            <div class="heurist-helper3">Unique, arbitrary, HTML ID for widget, for reference in javascript and from other widgets</div>
        </div>
        <div>
            <div class="header header_narrow">
                Widget label
            </div>

            <input name="name" class="text ui-widget-content"/>
            <div class="heurist-helper3">Please edit to clarify the tree</div>
        </div>

</fieldset>


</div>
