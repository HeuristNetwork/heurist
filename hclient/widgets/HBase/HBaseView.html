<div class="offcanvas" data-bs-scroll="true" data-bs-backdrop="false" tabindex="-1" data-heurist-role="container-offcanvas">
  <div class="offcanvas-header py-1 justify-content-end">
    <!-- <h6 class="offcanvas-title">Selected record</h6> -->
    <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">
  </div>
</div>

<div class="modal" tabindex="-1" data-heurist-role="container-modal">
  <div class="modal-dialog modal-dialog-scrollable"> 
    <div class="modal-content">
      <div class="modal-header justify-content-end">
        <!-- <h6 class="modal-title" id="modalScrollableLabel">Modal title</h6> -->
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
      </div>
      <div class="modal-footer py-1">
        <button type="button" data-bs-dismiss="modal" class="btn btn-secondary">Close</button>
      </div>
    </div>
  </div>
</div>

<div class="inline" tabindex="-1" data-heurist-role="container-inline">
    <div class="ui-dialog-titlebar ui-corner-all ui-widget-header ui-helper-clearfix">
        <span class="ui-dialog-title">Title</span>
        <button type="button" class="ui-button ui-corner-all ui-widget ui-button-icon-only ui-dialog-titlebar-close" title="Close">
            <span class="ui-button-icon ui-icon ui-icon-closethick"></span><span class="ui-button-icon-space"> </span>Close</button>
          
    </div>

    <div class="inline-body"></div>

    <div class="ui-dialog-buttonpane ui-widget-content ui-helper-clearfix" style="padding:10px">
        <div class="ui-dialog-buttonset">
            <button class="ui-button ui-corner-all ui-widget">Close</button>
        </div>
    </div>
</div>
