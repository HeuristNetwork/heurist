<div class="ent_header" style="text-align:right; padding: 5px 2px; font-size:0.9em">
    <div class="btn-save-only ui-button-action" style="margin-right:4px">Save</div>
    <div class="btn-save-and-close ui-button-action" style="margin-right:4px">Save and Close</div>
    <div class="btn-cancel" style="margin-right:10px">Cancel</div>
</div>

<div class="ent_content_full" style="top:30px; font-size: 11px;">

    <!-- General stuff -->
    
    <fieldset style="border: 1px solid lightgray;border-radius:4px;margin: 2px 4px;">
        <legend style="display:none"></legend>
        
        <div>
            <div class="header_narrow">Background:</div>
            <select name="bgColor" style="max-width:7rem">
                <option value="">select...</option>
                <option bg-color="bg-primary">bg-primary</option>
                <option bg-color="bg-primary-subtle">bg-primary-subtle</option>
                <option bg-color="bg-secondary">bg-secondary</option>
                <option bg-color="bg-secondary-subtle">bg-secondary-subtle</option>
                <option bg-color="bg-success">bg-success</option>
                <option bg-color="bg-success-subtle">bg-success-subtle</option>
                <option bg-color="bg-danger">bg-danger</option>
                <option bg-color="bg-danger-subtle">bg-danger-subtle</option>
                <option bg-color="bg-warning">bg-warning</option>
                <option bg-color="bg-warning-subtle">bg-warning-subtle</option>
                <option bg-color="bg-info">bg-info</option>
                <option bg-color="bg-info-subtle">bg-info-subtle</option>
                <option bg-color="bg-light">bg-light</option>
                <option bg-color="bg-light-subtle">bg-light-subtle</option>
                <option bg-color="bg-dark">bg-dark</option>
                <option bg-color="bg-dark-subtle">bg-dark-subtle</option>
                <option bg-color="bg-body-secondary">bg-body-secondary</option>
                <option bg-color="bg-body-tertiary">bg-body-tertiary</option>
                <option bg-color="bg-body">bg-body</option>
                <option bg-color="bg-black">bg-black</option>
                <option bg-color="bg-white">bg-white</option>
                <option bg-color="bg-transparent">bg-transparent</option>
            </select>
        </div>
        
        <div>
            <div class="header_narrow">Text color:</div>
            <select name="textColor" style="max-width:7rem">
                <option value="">select...</option>
                <option text-color="text-primary">text-primary</option>
                <option text-color="text-primary-emphasis">text-primary-emphasis</option>
                <option text-color="text-secondary">text-secondary</option>
                <option text-color="text-secondary-emphasis">text-secondary-emphasis</option>
                <option text-color="text-success">text-success</option>
                <option text-color="text-success-emphasis">text-success-emphasis</option>
                <option text-color="text-danger">text-danger</option>
                <option text-color="text-danger-emphasis">text-danger-emphasis</option>
                <option text-color="text-warning">text-warning</option>
                <option text-color="text-warning-emphasis">text-warning-emphasis</option>
                <option text-color="text-info">text-info</option>
                <option text-color="text-info-emphasis">text-info-emphasis</option>
                <option text-color="text-light">text-light</option>
                <option text-color="text-light-emphasis">text-light-emphasis</option>
                <option text-color="text-dark">text-dark</option>
                <option text-color="text-dark-emphasis">text-dark-emphasis</option>
                <option text-color="text-body-secondary">text-body-secondary</option>
                <option text-color="text-body-tertiary">text-body-tertiary</option>
                <option text-color="text-body">text-body</option>
                <option text-color="text-black">text-black</option>
                <option text-color="text-white">text-white</option>
            </select>
        </div>
    </fieldset>
    
    <fieldset style="border: 1px solid lightgray;border-radius:4px;margin: 2px 4px;">
        <legend style="display:none"></legend>
        
        <div>
            <div class="header_narrow">Position:</div>        
            <select name="position">
                <option value="">select...</option>
                <option value="default">default</option>
                <option value="fixed">fixed</option>
                <option value="hidden">hidden</option>
            </select>
        </div>

        <div>
            <div class="header_narrow">Width:</div>        
            <input data-type="css" name="width" type="text" min="0" placeholder="auto" style="width:50px" class="text ui-widget-content"/>
            <label for="">&nbsp;Height:
            <input data-type="css" name="height"  type="text" min="0" placeholder="auto" style="width:50px" class="text ui-widget-content"/></label>
        </div>
-->        

        <div>
            <div class="header_narrow">
                Template
            </div>
            <select name="template" class="text ui-widget-content ui-corner-all" title="">
            </select>
        </div>
        

        <div style="text-align:center;display: block;">
            <hr>
            <div class="btn-html-edit">Edit HTML source</div>
        </div>
    </fieldset>
    <div id="codemirror-container" style="display:none;">
    </div>
</div>
