<fieldset style="padding:0;line-height:20px"><legend style="display:none"></legend>

    <div>
        <div class="header" style="vertical-align:top"><label for="pageName">Name of page:&nbsp;</label></div>
        <input id="pageName" style="width:400px"/>
    </div>
    <div>
        <div class="header"><label for="pageContent">Select content:&nbsp;</label></div>
        <select id="pageContent" class="text ui-widget-content ui-corner-all" style="min-width:400px"
            title="">
            <option value="default">Simple (blank page)</option>
            <option value="discover">Discover (filters/results/map)</option>
            <option value="database">Database description</option>
            <option value="blog">Blog</option>
            
            <option disabled="disabled">-</option>

            <option value="landing">Landing page</option>
            <option value="about">About and our team</option>
            <!--
            <option value="cover">Cover page</option>
            <option value="features">Features</option>
            -->
            
        </select>
    </div>
</fieldset>
