<div class="offcanvas" data-bs-scroll="true" data-bs-backdrop="false" tabindex="-1" data-heurist-role="container-offcanvas">
  <div class="offcanvas-header py-1 justify-content-end">
    <!-- <h6 class="offcanvas-title">Selected record</h6> -->
    <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">
  </div>
</div>

<div class="modal" tabindex="-1" data-heurist-role="container-modal">
  <div class="modal-dialog modal-dialog-scrollable"> 
    <div class="modal-content">
      <div class="modal-header justify-content-end">
        <!-- <h6 class="modal-title" id="modalScrollableLabel">Modal title</h6> -->
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
      </div>
      <div class="modal-footer py-1">
        <button type="button" data-bs-dismiss="modal" class="btn btn-secondary">Close</button>
      </div>
    </div>
  </div>
</div>
