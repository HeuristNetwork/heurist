# Apache vhost for the Heurist Docker image.
# DocumentRoot is the HEURIST parent directory (the "switchboard"), matching
# server_management/code_setup/virtual_host_configuration_howto.txt.
<VirtualHost *:8080>
    DocumentRoot /var/www/html/HEURIST/
    ServerName localhost
    AddDefaultCharset utf-8

    <Directory /var/www/html/HEURIST/>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Belt and braces: never serve the filestore directly
    <Directory /var/www/html/HEURIST/HEURIST_FILESTORE/>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/heurist_error.log
    CustomLog ${APACHE_LOG_DIR}/heurist_access.log combined
</VirtualHost>
