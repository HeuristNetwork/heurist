; PHP settings for a Heurist development instance.
; Heurist handles large media uploads and long-running import/export jobs.
upload_max_filesize = 256M
post_max_size = 256M
memory_limit = 512M
max_execution_time = 120

; Errors must NEVER be printed into the response body: Heurist returns JSON
; and binary data on many endpoints, and stray output (e.g. PHP 8.2
; "Using ${var} in strings is deprecated" notices from the external
; Mysqldump8.php library) corrupts responses and breaks session/cookie
; handling during database creation. Log everything to stderr instead;
; `docker compose logs web` shows PHP errors and deprecations.
log_errors = On
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL
error_log = /dev/stderr
