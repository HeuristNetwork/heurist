name: Lint - Easy Coding Standard and PHPStan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php_lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-php-composer
    - name: PHP lint
      run: php -l *.php **/*.php

  ecs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-php-composer
    - name: Easy Coding Standard
      run: vendor/bin/ecs

  phpstan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-php-composer
    - uses: ./.github/actions/download-external-dependencies
    - name: PHPStan
      run: vendor/bin/phpstan analyse
