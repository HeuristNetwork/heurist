name: Lint - Easy Coding Standard and PHPStan

on: [push]

permissions:
  contents: read

jobs:
  ecs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: php-actions/composer@v6
    - name: Easy Coding Standard
      run: vendor/bin/ecs

  phpstan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: php-actions/composer@v6
    - name: Easy Coding Standard
      run: vendor/bin/phpstan analyse
