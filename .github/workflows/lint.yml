name: Lint - Easy Coding Standard and PHPStan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php_lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: php-actions/composer@8a65f0d3c6a1d17ca4800491a40b5756a4c164f3 # 6.1.2
      with:
        php_version: "8.5"
        php_extensions: pdo_mysql
    - name: PHP lint
      run: php -l *.php **/*.php

  ecs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: php-actions/composer@8a65f0d3c6a1d17ca4800491a40b5756a4c164f3 # 6.1.2
      with:
        php_version: "8.5"
        php_extensions: pdo_mysql
    - name: Easy Coding Standard
      run: vendor/bin/ecs

  phpstan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: php-actions/composer@8a65f0d3c6a1d17ca4800491a40b5756a4c164f3 # 6.1.2
      with:
        php_version: "8.5"
        php_extensions: pdo_mysql
    - uses: ./.github/actions/download-external-dependencies
    - name: PHPStan
      run: vendor/bin/phpstan analyse
