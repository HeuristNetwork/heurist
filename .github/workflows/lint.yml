name: Lint - Easy Coding Standard and PHPStan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ecs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: php-actions/composer@8a65f0d3c6a1d17ca4800491a40b5756a4c164f3 # 6.1.2
      with:
        php_version: "8.5"
        php_extensions: pdo_mysql
    - name: Easy Coding Standard
      run: vendor/bin/ecs

  phpstan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: php-actions/composer@8a65f0d3c6a1d17ca4800491a40b5756a4c164f3 # 6.1.2
      with:
        php_version: "8.5"
        php_extensions: pdo_mysql
    - name: Download external dependencies
      run: |
         curl -fsSL --proto '=https' --proto-redir '=https' --retry 3 --retry-delay 3 -o ext.tar.bz2 https://heuristref.net/HEURIST/DISTRIBUTION/HEURIST_SUPPORT/external_h5.tar.bz2
         tar -xjf ext.tar.bz2 && rm -f ext.tar.bz2
         mv external_h5 external
    - name: PHPStan
      run: vendor/bin/phpstan analyse
