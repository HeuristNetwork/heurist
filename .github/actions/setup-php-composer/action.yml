name: "Setup PHP and Composer"
runs:
  using: composite
  steps:
    - name: Setup PHP with Composer
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: '8.5'
        extensions: pdo_mysql xdebug
        coverage: xdebug
        # ini values for PHPUnit
        ini-values: display_errors=On, display_startup_errors=On, error_reporting=-1, zend.assertions=1
    - run: composer install --no-interaction
      shell: bash
