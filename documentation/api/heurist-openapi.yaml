openapi: 3.1.0
info:
  title: Heurist Read API
  version: 1.0.0-beta
  summary: Public read access to Heurist databases, records, database definitions, annotations and IIIF resources
  description: 'This specification describes the public read API currently exposed through

    `hserv/controller/api.php`.


    The compact, unversioned base URI is retained. Descriptive and abbreviated

    definition routes are equivalent aliases; neither form is deprecated.


    The modern definition collection envelope applies to server databases, record

    types, fields, terms, term links and record structures. Record responses retain the established

    `records` array and record/detail objects while adding metadata and pagination. Successful IIIF

    responses remain direct IIIF Presentation API resources and are never wrapped

    in a Heurist-specific envelope.

    '
servers:
- url: https://{host}/api
  description: A Heurist installation
  variables:
    host:
      default: heuristref.net
      description: Host name of the Heurist server
tags:
- name: Databases
  description: List registered databases available on the server
- name: Records
  description: Search for and retrieve records
- name: Database structure
  description: Retrieve record types, fields, terms, term links and record structures
- name: Authentication
  description: Obtain JWT tokens or manage a browser-backed session
- name: IIIF
  description: Retrieve direct IIIF Presentation API v3 resources
- name: Annotations
  description: Read IIIF Web Annotation records and AnnotationPages
paths:
  /databases:
    get:
      tags:
      - Databases
      operationId: listDatabases
      summary: List registered databases
      description: Server-level public route. No database path segment or authentication is required. Results use the standard collection envelope. Use details=full to include registration ID, title, rights and description.
      security:
      - {}
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/DatabaseDetails'
      - $ref: '#/components/parameters/RegisteredDatabaseIdFilter'
      responses:
        '200':
          description: Registered databases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
  /databases/{databaseName}:
    get:
      tags:
      - Databases
      operationId: getDatabase
      summary: Retrieve one registered database
      description: Server-level public route. The database is selected by its database name.
      security:
      - {}
      parameters:
      - $ref: '#/components/parameters/DatabaseName'
      - $ref: '#/components/parameters/DatabaseDetails'
      responses:
        '200':
          description: Registered database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseDefinition'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /dbs:
    get:
      tags:
      - Databases
      operationId: listDatabasesShortAlias
      summary: List registered databases using the short alias
      description: Equivalent alias of /databases.
      security:
      - {}
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/DatabaseDetails'
      - $ref: '#/components/parameters/RegisteredDatabaseIdFilter'
      responses:
        '200':
          description: Registered databases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
  /dbs/{databaseName}:
    get:
      tags:
      - Databases
      operationId: getDatabaseShortAlias
      summary: Retrieve one registered database using the short alias
      description: Equivalent alias of /databases/{databaseName}.
      security:
      - {}
      parameters:
      - $ref: '#/components/parameters/DatabaseName'
      - $ref: '#/components/parameters/DatabaseDetails'
      responses:
        '200':
          description: Registered database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseDefinition'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /{database}/databases:
    get:
      tags:
      - Databases
      operationId: listDatabasesWithIgnoredDatabaseSegment
      summary: List registered databases with a compatibility database segment
      description: Compatibility form. The database path segment is accepted but ignored; the result is the same server-level collection as /databases.
      security:
      - {}
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/DatabaseDetails'
      - $ref: '#/components/parameters/RegisteredDatabaseIdFilter'
      responses:
        '200':
          description: Registered databases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
  /{database}/dbs:
    get:
      tags:
      - Databases
      operationId: listDatabasesShortAliasWithIgnoredDatabaseSegment
      summary: List registered databases using the short alias and a compatibility database segment
      description: Compatibility form. The database path segment is accepted but ignored; the result is the same server-level collection as /dbs.
      security:
      - {}
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/DatabaseDetails'
      - $ref: '#/components/parameters/RegisteredDatabaseIdFilter'
      responses:
        '200':
          description: Registered databases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
  /{database}/records:
    get:
      tags:
      - Records
      operationId: searchRecords
      summary: Search records
      description: Anonymous requests return only publicly visible records. The response keeps the established records
        array and record detail structure, and adds metadata and pagination. A missing or inaccessible record returns
        an empty records array.
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - name: q
        in: query
        schema:
          type: string
        description: Heurist search expression.
      - name: w
        in: query
        schema:
          type: string
        description: Heurist search mode/domain.
      - name: ids
        in: query
        schema:
          type: string
        example: 123,456
        description: Comma-separated record identifiers.
      - name: fields
        in: query
        schema:
          type: string
        description: Comma-separated record header fields and/or numeric detail type IDs. rec_ID and rec_RecTypeID are always included in normal object mode. When omitted, rec_Title and all details are also returned. An explicit fields=rec_ID still returns record objects.
      - name: detail
        in: query
        schema:
          type: string
          enum:
          - ids
        description: Set to ids for an ID-only records array. This mode takes precedence over and ignores fields.
        RecordItemMeta:
      type: object
      required:
      - database
      - entity
      - self
      - fields
      properties:
        database:
          type: string
        entity:
          type: string
          const: records
        self:
          type: string
          format: uri
        fields:
          $ref: '#/components/schemas/RecordFieldsMeta'
      additionalProperties: false
  responses:
        '200':
          description: Records response with metadata and pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
  /{database}/records/{recordId}:
    get:
      tags:
      - Records
      operationId: getRecord
      summary: Retrieve one record
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/RecordId'
      - name: fields
        in: query
        schema:
          type: string
        description: Comma-separated record header fields and/or numeric detail type IDs. rec_ID and rec_RecTypeID are always included in normal object mode. When omitted, rec_Title and all details are also returned. An explicit fields=rec_ID still returns record objects.
      - name: detail
        in: query
        schema:
          type: string
          enum:
          - ids
        description: Set to ids for an ID-only records array. This mode takes precedence over and ignores fields.
      responses:
        '200':
          description: Records response for one requested record. Missing or inaccessible records return an empty records array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Anonymous requests return only publicly visible records. The response keeps the established records
        array and record detail structure, and adds metadata and pagination. A missing or inaccessible record returns
        an empty records array.
  /{database}/rectypes:
    get:
      tags:
      - Database structure
      operationId: listRecordTypes
      summary: Retrieve record type definitions
      security: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/Details'
      - name: rty_ID
        in: query
        schema:
          type: integer
          minimum: 1
      - name: rty_Name
        in: query
        schema:
          type: string
      - name: rty_RecTypeGroupID
        in: query
        schema:
          type: integer
      - name: rty_OriginatingDBID
        in: query
        schema:
          type: integer
      responses: &id001
        '200':
          description: Definition collection; empty matches return an empty items array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefinitionCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /{database}/rectypes/{recordTypeId}:
    get:
      tags:
      - Database structure
      operationId: getRecordType
      summary: Retrieve one record type definition
      security: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/RecordTypeId'
      - $ref: '#/components/parameters/Details'
      responses: &id002
        '200':
          description: Definition object returned directly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Definition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /{database}/fields:
    get:
      tags:
      - Database structure
      operationId: listFields
      summary: Retrieve field definitions
      security: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/Details'
      - name: dty_ID
        in: query
        schema:
          type: integer
          minimum: 1
      - name: dty_Name
        in: query
        schema:
          type: string
      - name: dty_Type
        in: query
        schema:
          type: string
      - name: dty_Status
        in: query
        schema:
          type: string
      - name: dty_DetailTypeGroupID
        in: query
        schema:
          type: integer
      - name: dty_OriginatingDBID
        in: query
        schema:
          type: integer
      responses: *id001
  /{database}/fields/{fieldId}:
    get:
      tags:
      - Database structure
      operationId: getField
      summary: Retrieve one field definition
      security: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/FieldId'
      - $ref: '#/components/parameters/Details'
      responses: *id002
  /{database}/terms:
    get:
      tags:
      - Database structure
      operationId: listTerms
      summary: Retrieve vocabulary terms
      security: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/Details'
      - name: trm_ID
        in: query
        schema:
          type: integer
          minimum: 1
      - name: trm_Label
        in: query
        schema:
          type: string
      - name: trm_Domain
        in: query
        schema:
          type: string
      - name: trm_Status
        in: query
        schema:
          type: string
      - name: trm_Code
        in: query
        schema:
          type: string
      - name: trm_ParentTermID
        in: query
        schema:
          type: integer
      - name: trm_OriginatingDBID
        in: query
        schema:
          type: integer
      responses: *id001
  /{database}/terms/{termId}:
    get:
      tags:
      - Database structure
      operationId: getTerm
      summary: Retrieve one vocabulary term
      security: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/TermId'
      - $ref: '#/components/parameters/Details'
      responses: *id002
  /{database}/termlinks:
    get:
      tags:
      - Database structure
      operationId: listTermLinks
      summary: Retrieve term parent-link relationships
      description: Returns rows from `defTermsLinks`. Each item preserves the parent and term IDs. Links may represent either the explicit `trm_ParentTermID` hierarchy or an additional implicit vocabulary/parent association.
      security: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - name: parentId
        in: query
        description: Return links whose `trl_ParentID` equals this term ID.
        schema:
          type: integer
          minimum: 1
      - name: termId
        in: query
        description: Return links whose `trl_TermID` equals this term ID.
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Term links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TermLinkSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
  /{database}/recstructure/{recordTypeId}:
    get:
      tags:
      - Database structure
      operationId: getRecordStructure
      summary: Retrieve the complete field structure of a record type
      description: Returns a collection. The public identity is the record type identifier, not the internal `rst_ID`
        primary key.
      security: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/RecordTypeId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/Details'
      - name: rst_DetailTypeID
        in: query
        schema:
          type: integer
          minimum: 1
      responses: *id001
  /{database}/recstructure/{recordTypeId}/{fieldId}:
    get:
      tags:
      - Database structure
      operationId: getRecordStructureField
      summary: Retrieve one field within a record type structure
      security: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/RecordTypeId'
      - $ref: '#/components/parameters/FieldId'
      - $ref: '#/components/parameters/Details'
      responses: *id002
  /{database}/rty:
    get:
      tags:
      - Database structure
      operationId: listRecordTypesShort
      summary: Compact alias for `rectypes`
      security: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/Details'
      responses: *id001
  /{database}/rty/{recordTypeId}:
    get:
      tags:
      - Database structure
      operationId: getRecordTypeShort
      summary: Compact alias for `rectypes/{recordTypeId}`
      security: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/RecordTypeId'
      - $ref: '#/components/parameters/Details'
      responses: *id002
  /{database}/dty:
    get:
      tags:
      - Database structure
      operationId: listFieldsShort
      summary: Compact alias for `fields`
      security: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/Details'
      responses: *id001
  /{database}/dty/{fieldId}:
    get:
      tags:
      - Database structure
      operationId: getFieldShort
      summary: Compact alias for `fields/{fieldId}`
      security: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/FieldId'
      - $ref: '#/components/parameters/Details'
      responses: *id002
  /{database}/trm:
    get:
      tags:
      - Database structure
      operationId: listTermsShort
      summary: Compact alias for `terms`
      security: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/Details'
      responses: *id001
  /{database}/trm/{termId}:
    get:
      tags:
      - Database structure
      operationId: getTermShort
      summary: Compact alias for `terms/{termId}`
      security: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/TermId'
      - $ref: '#/components/parameters/Details'
      responses: *id002
  /{database}/trl:
    get:
      tags:
      - Database structure
      operationId: listTermLinksShort
      summary: Compact alias for `termlinks`
      description: Equivalent alias of `/{database}/termlinks`.
      security: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - name: parentId
        in: query
        description: Return links whose `trl_ParentID` equals this term ID.
        schema:
          type: integer
          minimum: 1
      - name: termId
        in: query
        description: Return links whose `trl_TermID` equals this term ID.
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Term links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TermLinkSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
  /{database}/rst/{recordTypeId}:
    get:
      tags:
      - Database structure
      operationId: getRecordStructureShort
      summary: Compact alias for `recstructure/{recordTypeId}`
      security: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/RecordTypeId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/Details'
      responses: *id001
  /{database}/rst/{recordTypeId}/{fieldId}:
    get:
      tags:
      - Database structure
      operationId: getRecordStructureFieldShort
      summary: Compact alias for `recstructure/{recordTypeId}/{fieldId}`
      security: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/RecordTypeId'
      - $ref: '#/components/parameters/FieldId'
      - $ref: '#/components/parameters/Details'
      responses: *id002
  /{database}/login:
    post:
      tags:
      - Authentication
      operationId: loginSession
      summary: Create a cookie-backed Heurist session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionLoginRequest'
      responses:
        '200':
          description: Session established; response body is empty.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /{database}/logout:
    post:
      tags:
      - Authentication
      operationId: logoutSession
      summary: End the current cookie-backed session
      responses:
        '200':
          description: Session ended; response body is empty.
  /{database}/iiif/manifest/{identifier}:
    get:
      tags:
      - IIIF
      operationId: getIiifManifest
      summary: Retrieve an IIIF Presentation v3 Manifest
      security:
      - {}
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/IiifIdentifier'
      - name: omit_annotation_pages
        in: query
        schema:
          type: integer
          enum:
          - 0
          - 1
      responses: &id003
        '200':
          description: Direct IIIF resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IiifResource'
            application/ld+json:
              schema:
                $ref: '#/components/schemas/IiifResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
  /{database}/iiif/canvas/{identifier}:
    get:
      tags:
      - IIIF
      operationId: getIiifCanvas
      summary: Retrieve an IIIF Presentation v3 Canvas
      security:
      - {}
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/IiifIdentifier'
      - name: omit_annotation_pages
        in: query
        schema:
          type: integer
          enum:
          - 0
          - 1
      responses: *id003
  /{database}/iiif/page/{identifier}:
    get:
      tags:
      - IIIF
      operationId: getIiifPaintingPage
      summary: Retrieve a painting AnnotationPage
      security:
      - {}
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/IiifIdentifier'
      responses: *id003
  /{database}/iiif/annotation/{identifier}:
    get:
      tags:
      - IIIF
      operationId: getIiifPaintingAnnotation
      summary: Retrieve a painting Annotation
      security:
      - {}
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/IiifIdentifier'
      responses: *id003
  /{database}/iiif/annotations/{identifier}:
    get:
      tags:
      - IIIF
      operationId: getIiifLinkedAnnotationPage
      summary: Retrieve a linked AnnotationPage
      security:
      - {}
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/IiifIdentifier'
      responses: *id003
  /{database}/annotations/pages:
    get:
      tags:
      - Annotations
      operationId: listCanvasAnnotations
      summary: Retrieve an AnnotationPage for a Canvas URI
      security:
      - {}
      parameters:
      - $ref: '#/components/parameters/Database'
      - name: uri
        in: query
        required: true
        schema:
          type: string
          format: uri
      responses: *id003
  /{database}/annotations/{annotationId}:
    get:
      tags:
      - Annotations
      operationId: getAnnotationRecord
      summary: Retrieve one Web Annotation
      security:
      - {}
      parameters:
      - $ref: '#/components/parameters/Database'
      - name: annotationId
        in: path
        required: true
        schema:
          type: string
      responses: *id003
  /{database}/annotations/{manifestRecordId}/pages:
    get:
      tags:
      - Annotations
      operationId: listManifestCanvasAnnotations
      summary: Retrieve an AnnotationPage constrained to a Manifest record
      security:
      - {}
      parameters:
      - $ref: '#/components/parameters/Database'
      - name: manifestRecordId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: uri
        in: query
        required: true
        schema:
          type: string
          format: uri
      responses: *id003
  /{database}/annotations/{manifestRecordId}/{annotationId}:
    get:
      tags:
      - Annotations
      operationId: getManifestAnnotation
      summary: Retrieve one Web Annotation constrained to a Manifest record
      security:
      - {}
      parameters:
      - $ref: '#/components/parameters/Database'
      - name: manifestRecordId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: annotationId
        in: path
        required: true
        schema:
          type: string
      responses: *id003
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT supplied in the Authorization header. Existing Heurist browser sessions may also be recognised.
  parameters:
    Database:
      name: database
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      example: my_database
    DatabaseName:
      name: databaseName
      in: path
      required: true
      description: Heurist database name as returned in sys_Database.
      schema:
        type: string
        minLength: 1
      example: my_database
    DatabaseDetails:
      name: details
      in: query
      description: Return only database names with id, or full database registration information with full.
      schema:
        type: string
        enum:
        - id
        - full
        default: id
    RegisteredDatabaseIdFilter:
      name: sys_dbRegisteredID
      in: query
      description: Filter by registered database ID. Comparison syntax such as >0 is accepted.
      schema:
        type: string
      example: '>0'
    RecordId:
      name: recordId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    RecordTypeId:
      name: recordTypeId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    FieldId:
      name: fieldId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    TermId:
      name: termId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    IiifIdentifier:
      name: identifier
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 1000
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Details:
      name: details
      in: query
      description: Entity-specific response projection. Existing DbDefXXX modes remain available; commonly used
        values include id, name, list, full, raw and structure where supported.
      schema:
        type: string
  schemas:
    Error:
      type: object
      required:
      - status
      - error
      - message
      properties:
        status:
          type: integer
          description: HTTP response status code.
          example: 404
        error:
          type: string
          description: Heurist API response status constant defined in consts.php.
          enum:
          - invalid
          - notfound
          - denied
          - blocked
          - error
          - database
          - syscfg
          - system
          - network
          - unknown
          example: notfound
        message:
          type: string
          example: Definition not found
      additionalProperties: false
    DatabaseDefinition:
      type: object
      required:
      - sys_Database
      properties:
        sys_Database:
          type: string
          description: Database name used in API path segments.
        sys_dbRegisteredID:
          type: integer
          description: Registered database identifier.
        sys_dbName:
          type: string
          description: Display name of the database.
        sys_dbRights:
          type: string
        sys_dbDescription:
          type: string
      additionalProperties: true
    DatabaseMeta:
      type: object
      required:
      - database
      - entity
      properties:
        database:
          type: 'null'
          description: Always null because database listing is a server-level request.
        entity:
          type: string
          const: databases
      additionalProperties: false
    DatabaseSearchResponse:
      type: object
      required:
      - items
      - meta
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DatabaseDefinition'
        meta:
          $ref: '#/components/schemas/DatabaseMeta'
        pagination:
          $ref: '#/components/schemas/Pagination'
      additionalProperties: false
    Definition:
      type: object
      additionalProperties: true
    DefinitionMeta:
      type: object
      required:
      - database
      - entity
      properties:
        database:
          type: string
        entity:
          type: string
          enum:
          - rectypes
          - fields
          - terms
          - termlinks
          - recstructure
        recordTypeId:
          type: integer
          minimum: 1
      additionalProperties: false
    Pagination:
      type: object
      required:
      - total
      - offset
      - limit
      - self
      - next
      properties:
        total:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 1000
        self:
          type: string
          format: uri
        next:
          oneOf:
          - type: string
            format: uri
          - type: 'null'
      additionalProperties: false
    DefinitionCollection:
      type: object
      required:
      - items
      - meta
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Definition'
        meta:
          $ref: '#/components/schemas/DefinitionMeta'
        pagination:
          $ref: '#/components/schemas/Pagination'
      additionalProperties: false
    TermLink:
      type: object
      required:
      - trl_ParentID
      - trl_TermID
      properties:
        trl_ParentID:
          type: integer
          minimum: 1
          description: Parent term or vocabulary ID stored in `defTermsLinks`.
        trl_TermID:
          type: integer
          minimum: 1
          description: Linked term ID stored in `defTermsLinks`.
      additionalProperties: false
    TermLinkMeta:
      type: object
      required:
      - database
      - entity
      properties:
        database:
          type: string
        entity:
          type: string
          const: termlinks
      additionalProperties: false
    TermLinkSearchResponse:
      type: object
      required:
      - items
      - meta
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TermLink'
        meta:
          $ref: '#/components/schemas/TermLinkMeta'
        pagination:
          $ref: '#/components/schemas/Pagination'
      additionalProperties: false
    Record:
      type: object
      description: A Heurist record object. By default it contains rec_ID, rec_RecTypeID, rec_Title and all visible
        details. The fields parameter can reduce the returned properties.
      properties:
        rec_ID:
          type: string
        rec_RecTypeID:
          type: string
        rec_Title:
          oneOf:
          - type: string
          - type: 'null'
        details:
          $ref: '#/components/schemas/RecordDetails'
      additionalProperties: true
    RecordSearchResponse:
      type: object
      required:
      - records
      - meta
      - pagination
      properties:
        records:
          type: array
          description: Record objects, or record IDs when detail=ids.
          items:
            oneOf:
            - $ref: '#/components/schemas/Record'
            - type: integer
            - type: string
        meta:
          $ref: '#/components/schemas/RecordsMeta'
        pagination:
          $ref: '#/components/schemas/Pagination'
      additionalProperties: false
    RecordItemResponse:
      type: object
      required:
      - records
      - meta
      properties:
        records:
          type: array
          maxItems: 1
          description: One record object, one record ID when detail=ids, or an empty array when missing or inaccessible.
          items:
            oneOf:
            - $ref: '#/components/schemas/Record'
            - type: integer
            - type: string
        meta:
          $ref: '#/components/schemas/RecordItemMeta'
      additionalProperties: false
    SessionLoginRequest:
      type: object
      required:
      - login
      - password
      properties:
        login:
          type: string
        password:
          type: string
          format: password
    IiifResource:
      type: object
      additionalProperties: true
    RecordDetails:
      type: object
      description: Map keyed by detail type ID; each value is a map keyed by detail row ID.
      additionalProperties:
        type: object
        additionalProperties: {}
    RecordDetailField:
      type: object
      required:
      - dty_ID
      - dty_Name
      - dty_Type
      properties:
        dty_ID:
          type: string
        dty_Name:
          type: string
        dty_Type:
          type: string
      additionalProperties: false
    RecordFieldsMeta:
      type: object
      required:
      - headers
      - details
      properties:
        headers:
          type: array
          items:
            type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/RecordDetailField'
      additionalProperties: false
    RecordsMeta:
      type: object
      required:
      - database
      - entity
      - fields
      properties:
        database:
          type: string
        entity:
          type: string
          const: records
        fields:
          $ref: '#/components/schemas/RecordFieldsMeta'
      additionalProperties: false
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication is required or the bearer token is invalid
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Requested item was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MethodNotAllowed:
      description: HTTP method is not supported
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
