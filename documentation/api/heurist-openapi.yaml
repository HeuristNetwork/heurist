openapi: 3.1.0
info:
  title: Heurist API
  version: 1.0.0-beta
  summary: Read access to Heurist databases, records, database definitions, maps, timeline data, annotations
    and IIIF resources; writes of system records, reports and background jobs for logged-in users
  description: 'This specification describes the public read API currently exposed through

    `hserv/controller/api.php`.


    The compact, unversioned base URI is retained. Descriptive and abbreviated

    definition routes are equivalent aliases; neither form is deprecated.


    The modern definition collection envelope applies to server databases, record

    types, fields, terms, term links and record structures. Record responses retain the established

    `records` array and record/detail objects while adding metadata and pagination. Successful IIIF

    responses remain direct IIIF Presentation API resources and are never wrapped

    in a Heurist-specific envelope.



    Map and timeline endpoints return engine-neutral MapDocument, MapLayer, GeoJSON and temporal presentation resources.'
servers:
- url: ../api
  description: This Heurist installation (same server as this documentation)
- url: '{scheme}://{host}/api'
  description: A Heurist installation
  variables:
    scheme:
      default: https
      enum:
      - https
      - http
      description: Protocol used to reach the Heurist server
    host:
      default: heuristref.net
      description: Host name of the Heurist server, including any path prefix (e.g. 127.0.0.1/heurist)
tags:
- name: Databases
  description: List registered databases available on the server
- name: Records
  description: Search for and retrieve records
- name: System records
  description: Search authenticated system records using stable filter and user mappings
- name: Database structure
  description: Retrieve record types, fields, terms, term links and record structures
- name: Authentication
  description: Obtain JWT tokens or manage a browser-backed session
- name: IIIF
  description: Retrieve direct IIIF Presentation API v3 resources
- name: Annotations
  description: Read IIIF Web Annotation records and AnnotationPages
- name: Maps
  description: Retrieve public MapDocument and MapLayer definitions, Heurist record/query GeoJSON, and file-backed map datasource content
- name: Timeline
  description: Retrieve public temporal data for Heurist record queries
- name: Jobs
  description: Background jobs of logged-in users - record export into a file, Smarty report preview and generation
- name: Record editing
  description: >-
    Insert, change, duplicate and delete records (logged-in users). The body is the record object of
    GET /records/{recordId}. For now only system record types can be written - custom reports, report
    schedules, map documents, map layers and their sources, query sources, website home and pages.
- name: Reports
  description: Smarty report templates, their records and schedules (reports manager)
- name: Files
  description: >-
    Registered files (uploads and external resources) as records of the record type Registered file
    (2-1106), in the JSON of /records: search, chunked upload, registration, changes, content and thumbnails.
    Logged-in users only, except the content and thumbnail of viewable files.
paths:
  /databases:
    get:
      tags:
      - Databases
      operationId: listDatabases
      summary: List registered databases
      description: Server-level public route. No database path segment or authentication is required. Results use
        the standard collection envelope. Use details=full to include registration ID, title, rights and description.
      security:
      - {}
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/DatabaseDetails'
      - $ref: '#/components/parameters/RegisteredDatabaseIdFilter'
      responses:
        '200':
          description: Registered databases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
  /databases/{databaseName}:
    get:
      tags:
      - Databases
      operationId: getDatabase
      summary: Retrieve one registered database
      description: Server-level public route. The database is selected by its database name.
      security:
      - {}
      parameters:
      - $ref: '#/components/parameters/DatabaseName'
      - $ref: '#/components/parameters/DatabaseDetails'
      responses:
        '200':
          description: Registered database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseDefinition'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /dbs:
    get:
      tags:
      - Databases
      operationId: listDatabasesShortAlias
      summary: List registered databases using the short alias
      description: Equivalent alias of /databases.
      security:
      - {}
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/DatabaseDetails'
      - $ref: '#/components/parameters/RegisteredDatabaseIdFilter'
      responses:
        '200':
          description: Registered databases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
  /dbs/{databaseName}:
    get:
      tags:
      - Databases
      operationId: getDatabaseShortAlias
      summary: Retrieve one registered database using the short alias
      description: Equivalent alias of /databases/{databaseName}.
      security:
      - {}
      parameters:
      - $ref: '#/components/parameters/DatabaseName'
      - $ref: '#/components/parameters/DatabaseDetails'
      responses:
        '200':
          description: Registered database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseDefinition'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /{database}/databases:
    get:
      tags:
      - Databases
      operationId: listDatabasesWithIgnoredDatabaseSegment
      summary: List registered databases with a compatibility database segment
      description: Compatibility form. The database path segment is accepted but ignored; the result is the same
        server-level collection as /databases.
      security:
      - {}
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/DatabaseDetails'
      - $ref: '#/components/parameters/RegisteredDatabaseIdFilter'
      responses:
        '200':
          description: Registered databases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
  /{database}/dbs:
    get:
      tags:
      - Databases
      operationId: listDatabasesShortAliasWithIgnoredDatabaseSegment
      summary: List registered databases using the short alias and a compatibility database segment
      description: Compatibility form. The database path segment is accepted but ignored; the result is the same
        server-level collection as /dbs.
      security:
      - {}
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/DatabaseDetails'
      - $ref: '#/components/parameters/RegisteredDatabaseIdFilter'
      responses:
        '200':
          description: Registered databases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
  /{database}/records:
    get:
      tags:
      - Records
      operationId: searchRecords
      summary: Search records
      description: >-
        Anonymous requests return only publicly visible records. By default each record is an envelope containing
        rec_ID, rec_RecTypeID and rec_Title. Use fields to add headers or native/linked details, or detail=ids for the
        IDs-only DTO. Counts, distinct values and bounds of the matching records are served by
        /{database}/records/aggregate (detail=count|rectypes|values|minmax|ranges was removed and gives 400).
        Graph documents are served by the separate /{database}/graph endpoint.
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - name: q
        in: query
        schema:
          type: string
        description: >-
          Heurist search expression. Link direction: lt:X (linked to) finds records whose pointer fields point
          to X; lf:X (linked from) finds records that X points to. Likewise for relationships, by the stored
          direction: rt:X finds records that are the stored source of a relationship to X; rf:X the stored
          target. related:X is a relationship in either stored direction; links:X is lt OR lf; connected:X is
          links OR related and takes no suffix. The optional suffix is a field ID: a pointer field for
          lt/lf/links (lt:240), a relationship (relmarker) field for rt/rf/related (related:155) - the field's
          vocabulary limits the relation types and its record types (owner, target) the two ends. Inside
          the value, r is the stored relation type (with child terms; for related the term or its inverse)
          and relf:N a field of the Relationship record: {"related:155":[{"t":14},{"r":4501},{"relf:10":">2001"}]}.
          An empty linked query ({"lf":[]}) matches any record; in expansion rules it is the parent result,
          written * in compact paths (*:lf:10). Compact paths use lt, lf, rt, rf and r (= related), each
          followed by a field ID (10:r155:14).
      - name: w
        in: query
        schema:
          type: string
        description: Heurist search mode/domain.
      - name: ids
        in: query
        schema:
          type: string
        example: 123,456
        description: Comma-separated record identifiers.
      - name: fields
        in: query
        schema:
          type: string
        description: >-
          Comma-separated header names, numeric detail type IDs, type-qualified direct fields such as 10:237, and
          linked paths such as 10:lt240:48:237. rec_ID, rec_RecTypeID and rec_Title are mandatory in record mode.
          When omitted, no detail values are returned.
      - name: detail
        in: query
        schema:
          type: string
          enum:
          - records
          - ids
          default: records
        description: >-
          ids returns the IDs-only DTO and ignores fields. The former count, rectypes, values, minmax and ranges are
          op values of /{database}/records/aggregate.
      - name: sort
        in: query
        schema:
          type: string
        description: Record order.
      - name: resolveDetails
        in: query
        schema:
          type: boolean
          default: false
        description: >-
          Resolve type-specific metadata using standard rec_*, trm_* and ulf_* field names. Linked values retain
          their path provenance whether this option is true or false.
      - name: defs
        in: query
        schema:
          type: boolean
          default: false
        description: >-
          Add meta.recordTypes and meta.terms - names and concept codes of the record types (records and resolved
          pointer targets) and terms used by the returned records. Field concept codes are always in meta.fields.details.
      responses:
        '200':
          description: Records response with metadata and pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordQueryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
      - Records
      operationId: searchRecordsPost
      summary: Search records using a structured request
      description: >-
        Executes the same record search as GET without URL-length restrictions. This is the preferred form for ID
        arrays, JSON queries, and selected native or linked fields.
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Database'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordSearchRequest'
            example:
              ids: [101, 102]
              fields: ['10:237', '10:lt240:48:134']
              resolveDetails: true
      responses:
        '200':
          description: Record envelopes or the IDs-only DTO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordQueryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
  /{database}/records/aggregate:
    get:
      tags:
      - Records
      operationId: aggregateRecords
      summary: Count, list values or find bounds over a record query
      description: >-
        The same query parameters as GET /records (q, ids, w, filter) and the same visibility; op selects the
        operation. count returns the query and total. rectypes returns the query, total and counts grouped by
        rec_RecTypeID. values returns the distinct values of field among the matching records with the number of
        records for each; limit is capped at 1000 and total is the number of distinct values. minmax returns the
        bounds of field among the matching records (for "auto" slider bounds) and the number of records that
        have a value. ranges returns the field's values grouped into ranges (groupby for dates, ranges for
        numbers) with the number of records in each; selecting a range with its from/to finds exactly that many
        records. debug=1|2 and the request id (rid, X-Heurist-Request-ID) work as for search, so a running
        aggregate can be stopped with POST /records/cancel.
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - name: op
        in: query
        required: true
        schema:
          type: string
          enum: [count, rectypes, values, minmax, ranges]
      - name: q
        in: query
        schema:
          type: string
        description: Heurist search expression, as for GET /records.
      - name: ids
        in: query
        schema:
          type: string
        example: 123,456
        description: Comma-separated record identifiers.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1000
        description: op=values only. Number of values returned.
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
        description: op=values only.
      - name: field
        in: query
        schema:
          type: string
        example: '1'
        description: >-
          op=values only (required there). A detail type ID (freetext, enum, relationtype, integer, float,
          year, date, boolean, resource, relmarker) or one of rectype, owner, addedby, access, tag, title. Enum values are
          term IDs (labels are resolved by the client); resource/relmarker values are linked record IDs with
          label (title) and rty; owner/addedby values carry label and kind (user or group); tags are limited to
          the current user and their groups. op=minmax (required there): a detail type ID of type integer,
          float, year or date, or added / modified. op=ranges: the same fields.
      - name: groupby
        in: query
        schema:
          type: string
          enum: [month, year, decade, century]
          default: year
        description: >-
          op=ranges, date fields only. Decades and centuries start at a multiple of 10 / 100 (1990-1999,
          1900-1999).
      - name: ranges
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 10
        description: >-
          op=ranges, numeric fields only. At most this many equal ranges with round boundaries (1, 2, 2.5 or
          5 x 10^n) between the smallest and largest value; integer fields get whole, non-overlapping ranges.
      - name: match
        in: query
        schema:
          type: string
          enum: [overlap, within]
          default: overlap
        description: >-
          op=ranges, detail date fields. overlap (operators <> and "falls in"): a date counts in every range its
          span overlaps. within (operator ><): only in a range that contains its whole span.
      - name: via
        in: query
        schema:
          type: string
        description: >-
          op=values only. JSON array of link predicates (lt, lf, rt, rf, related), outer first, from the
          matching records to the records carrying field, each with its own conditions, e.g.
          [{"lt:240":[{"t":"48"}]}]. Values are then counted by the matching (main) records that reach them:
          a main record counts once per value however many of its linked records carry it.
      - name: text
        in: query
        schema:
          type: string
        description: op=values only. Case-insensitive substring filter on the value or its label.
      - name: sort
        in: query
        schema:
          type: string
          enum: [count, value]
          default: count
        description: op=values only. count (most frequent first) or value (by label, else value).
      responses:
        '200':
          description: The result of the operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordAggregateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
      - Records
      operationId: aggregateRecordsPost
      summary: Aggregate over a record query using a structured request
      description: The same operation as GET, without URL-length restrictions (JSON queries, long ID lists).
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Database'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordAggregateRequest'
            example:
              q: [{t: '10'}]
              op: values
              field: '1'
              sort: count
      responses:
        '200':
          description: The result of the operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordAggregateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
  /{database}/records/cancel:
    post:
      tags:
      - Records
      operationId: cancelRecordQuery
      summary: Stop a running query of the current user
      description: >-
        Runs KILL QUERY on the database connection registered for the request id. Clients send the id with
        their search, aggregate, graph or map request (header X-Heurist-Request-ID or parameter rid). Only
        requests of the same user can be stopped; at most 50 ids per call.
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Database'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rid]
              properties:
                rid:
                  oneOf:
                  - type: string
                  - type: array
                    items: {type: string}
            example:
              rid: q-1727791234-3
      responses:
        '200':
          description: The result per request id
          content:
            application/json:
              schema:
                type: object
                required: [cancel]
                properties:
                  cancel:
                    type: object
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /{database}/records/{presentationType}/{recordId}:
    get:
      tags:
      - Records
      operationId: getRecordPresentation
      summary: Specialised representation of a query source, map document or map layer record
      description: >-
        querysource returns the Query Source definition stored in the record (query, rules, fields and
        options) for the client. document and layer return the same JSON as /{database}/map/document/{recordId}
        and /{database}/map/layer/{recordId}. A record that is missing, not visible or of another type gives 404.
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - name: presentationType
        in: path
        required: true
        schema:
          type: string
          enum: [querysource, document, layer]
      - name: recordId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: The representation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /{database}/def/snapshot:
    get:
      tags:
      - Database structure
      operationId: getDefinitionSnapshot
      summary: All database definitions in one cached document
      description: >-
        Record type groups, field groups, record types, fields, record structures, terms and term links, with
        meta (db, format, dbId, version, generated, language, languages, dbconst). Used by the client query
        builders and the query-language describer; it will replace /rty, /dty, /trm, /trl and /rst. The
        document is cached on the server and rebuilt when the definitions change; meta.version changes with it.
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Database'
      responses:
        '200':
          description: Definition snapshot
          content:
            application/json:
              schema:
                type: object
                required: [meta, rectypeGroups, fieldGroups, rectypes, fields, structure, terms, termlinks]
                properties:
                  meta:
                    type: object
                    additionalProperties: true
                  rectypeGroups: {}
                  fieldGroups: {}
                  rectypes: {}
                  fields: {}
                  structure: {}
                  terms: {}
                  termlinks: {}
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /{database}/graph:
    get:
      tags:
        - Records
      operationId: buildGraph
      summary: Build a graph document
      description: >-
        Runs a top-level query and returns a renderer-neutral graph document for the heurist-graph client. Graph
        records always carry exactly rec_ID, rec_Title and rec_RecTypeID; the fields parameter is not accepted.
        Provide links as a comma list of compact specs such as 10:lt240:48 (direct field link) or 10:rt3260:10
        (relationship link) to discover edges whose two endpoints are both in the result set, or links=all for
        every internal edge. Initial links never add external records. The canonical budget parameter is limits,
        a JSON object containing maxNodes, maxEdges and maxDepth. GET also accepts maxNodes, maxEdges and maxDepth
        as flat compatibility aliases; all values may lower the server budget but never raise it. The response reports
        nodesReturned, edgesReturned and truncated.
        The seed-page limit defaults to 1000 and is clamped to maxNodes; set limit explicitly to load a larger
        seed page. Server ceilings are 10000 nodes, 10000 edges and depth 10. Omission of query/q/ids searches
        all visible records. Current implementation discovers internal edges only: rule/rules are accepted and
        validated but expansion is not executed and paths is empty.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Database'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1000
          description: Seed page size, also capped by the effective node budget.
        - $ref: '#/components/parameters/Offset'
        - name: q
          in: query
          schema:
            type: string
          description: Heurist search expression for the seed record set.
        - name: ids
          in: query
          schema:
            type: string
          example: 123,456
          description: Comma-separated seed record identifiers.
        - name: links
          in: query
          schema:
            type: string
          description: >-
            all, or a comma-separated list of compact link specs (source:operator:target, operator one of
            lt|lf|rt|rf followed by a field or relation type ID). Omitted means no edge discovery.
        - name: maxNodes
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
          description: GET compatibility alias for limits.maxNodes. Capped at 10000; does not raise the seed-page limit.
        - name: maxEdges
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
          description: GET compatibility alias for limits.maxEdges. Capped at the server maximum of 10000.
        - name: maxDepth
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10
          description: GET compatibility alias for limits.maxDepth. Capped at the server maximum of 10.
        - name: query
          in: query
          schema:
            type: string
          description: Preferred alias for q; a Heurist expression or JSON-encoded query object/array.
        - name: limits
          in: query
          schema:
            type: string
          description: >-
            Canonical graph budget: JSON object containing maxNodes, maxEdges and maxDepth. Values take precedence
            over the flat GET compatibility aliases.
        - name: rule
          in: query
          schema:
            type: string
          description: One compact traversal step or JSON rule with query and no nested levels. Returns expansion.targetIds.
        - name: rules
          in: query
          schema:
            type: string
          description: Legacy alias for rule; at most one traversal step.
      responses:
        '200':
          description: Graph document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '422':
          description: Query uses an unsupported feature.
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Records
      operationId: buildGraphPost
      summary: Build a graph document using a structured request
      description: >-
        Executes the same graph build as GET without URL-length restrictions. This is the preferred form for ID
        arrays, JSON queries and an array of link specs. Seed limit defaults to 1000 independently of
        limits.maxNodes; set both for larger pages. Server ceilings: 10000 nodes, 10000 edges, depth 10.
        rule/rules execute one tree step and return expansion.targetIds for subsequent branch requests.
      security:
