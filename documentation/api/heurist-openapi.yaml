  /{database}/records/{recordId}:
    get:
      tags:
      - Records
      operationId: getRecord
      summary: Retrieve one record
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/RecordId'
      - name: fields
        in: query
        schema:
          type: string
        description: Comma-separated record header fields and/or numeric detail type IDs. rec_ID and rec_RecTypeID
          are always included in normal object mode. When omitted, rec_Title and all details are also returned.
          An explicit fields=rec_ID still returns record objects.
      - name: detail
        in: query
        schema:
          type: string
          enum:
          - ids
        description: Set to ids for an ID-only records array. This mode takes precedence over and ignores fields.
      - name: resolveDetails
        in: query
        schema:
          type: boolean
          default: false
        description: As for the records search - resolved values with standard rec_*, trm_* and ulf_* names.
      - name: defs
        in: query
        schema:
          type: boolean
          default: false
        description: >-
          Add meta.recordTypes and meta.terms - names and concept codes of the record types (records and resolved
          pointer targets) and terms used by the returned records. Field concept codes are always in meta.fields.details.
      responses:
        '200':
          description: Records response for one requested record. Missing or inaccessible records return an empty
            records array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Anonymous requests return only publicly visible records. The record object and meta are the same as
        for /records?ids={recordId} (details are arrays of values keyed by field ID); there is no pagination. A missing
        or inaccessible record returns an empty records array.
    post:
      tags:
      - Record editing
      operationId: insertRecord
      summary: Insert a record
      description: >-
        Inserts a record of a writable (system) record type. recordId 0 takes the next free id; a negative
        recordId inserts the record with that id (import), 409 if it exists. The owner is the current user and
        the visibility "viewable" unless the body gives them; website pages (RT_CMS_PAGE) belong to group 1 and
        are public. The title is the first name (DT_NAME) value without language prefix, or "Record #id".
        Cross-site rules - the body must be sent with Content-Type application/json (415 otherwise) and an
        Origin header must be this host (403 otherwise).
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/RecordWriteId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordInput'}
      responses:
        '201':
          description: The inserted record as GET /records/{recordId} returns it, with meta.issues (warnings).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordItemResponse'}
        '400':
          description: Invalid body (legacy format, unknown header) or a positive recordId
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordEditError'}
        '401':
          description: Not logged in
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordEditError'}
        '403':
          description: Not allowed (account, ownership, record type outside the writable list, other site)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordEditError'}
        '409':
          description: A record with the given (negative) id exists
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordEditError'}
        '415':
          description: Content-Type is not application/json
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordEditError'}
        '422':
          description: Invalid values - errors lists them by field
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordEditError'}
    put:
      tags:
      - Record editing
      operationId: replaceRecord
      summary: Replace a record
      description: >-
        The body replaces the whole record - detail fields and edit/view groups missing from the body are
        cleared; owner and visibility are kept when missing. Values of forbidden fields stay as stored. When the
        body has rec_Modified and it differs from the stored one the answer is 409, unless force=1.
        Cross-site rules - the body must be sent with Content-Type application/json (415 otherwise) and an
        Origin header must be this host (403 otherwise).
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/RecordWriteId'
      - $ref: '#/components/parameters/RecordForce'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordInput'}
      responses:
        '200':
          description: The saved record, with meta.issues (warnings).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordItemResponse'}
        '400':
          description: Invalid body, or rec_ID / rec_RecTypeID differ from the stored record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordEditError'}
        '401':
          description: Not logged in
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordEditError'}
        '403':
          description: Not allowed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordEditError'}
        '404':
          description: Record does not exist
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordEditError'}
        '409':
          description: The record was changed after it was loaded (rec_Modified gives the stored value)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordEditError'}
        '415':
          description: Content-Type is not application/json
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordEditError'}
        '422':
          description: Invalid values
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordEditError'}
    patch:
      tags:
      - Record editing
      operationId: patchRecord
      summary: Change some fields of a record
      description: >-
        Replaces only the detail fields in the body (an empty array clears a field); headers missing from the
        body are kept. The complete record is validated after the change.
        Cross-site rules - the body must be sent with Content-Type application/json (415 otherwise) and an
        Origin header must be this host (403 otherwise).
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/RecordWriteId'
      - $ref: '#/components/parameters/RecordForce'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordInput'}
      responses:
        '200':
          description: The saved record, with meta.issues (warnings).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordItemResponse'}
        '400':
          description: Invalid body
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordEditError'}
        '401':
          description: Not logged in
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordEditError'}
        '403':
          description: Not allowed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordEditError'}
        '404':
          description: Record does not exist
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordEditError'}
        '409':
          description: The record was changed after it was loaded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordEditError'}
        '415':
          description: Content-Type is not application/json
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordEditError'}
        '422':
          description: Invalid values
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordEditError'}
    delete:
      tags:
      - Record editing
      operationId: deleteRecord
      summary: Delete a record
      description: >-
        Without force a record that other records point to, or that is part of a relationship, is not deleted -
        the 409 answer lists the references. With force=1 the pointer values in the other records are removed and
        the relationship records are deleted too. Reminders, tags, comments, bookmarks and permissions of the
        record are removed. Cross-site rule - a real DELETE request (or POST with X-HTTP-Method DELETE); an
        Origin header must be this host.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/RecordWriteId'
      - $ref: '#/components/parameters/RecordForce'
      responses:
        '200':
          description: Deleted records.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordDeleteResponse'}
        '401':
          description: Not logged in
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordEditError'}
        '403':
          description: Not allowed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordEditError'}
        '404':
          description: Record does not exist
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordEditError'}
        '409':
          description: The record has references; nothing is deleted.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/RecordEditError'
                - type: object
                  properties:
                    references: {$ref: '#/components/schemas/RecordReferences'}
  /{database}/records/{recordId}/duplicate:
    post:
      tags:
      - Record editing
      operationId: duplicateRecord
      summary: Duplicate a record
      description: >-
        Copies the header, detail values and edit/view groups. The copy belongs to the current user (website
        pages - group 1, public) and its name values without language prefix start with "Copy of ".
        Relationship and linked records are not copied. The request needs Content-Type application/json (the
        body may be empty).
      security:
