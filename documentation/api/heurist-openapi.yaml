  /{database}/time:
    get:
      tags:
      - Timeline
      operationId: searchTimeline
      summary: Search records with temporal spans
      description: >-
        Runs the ordinary records query pipeline and adds a when array to each returned record. Supply q/query, ids,
        or neither; when none is supplied all visible records are searched. timefields selects direct or linked
        date/year fields. If omitted, all native date and year fields present on the returned top records are used;
        linked records are traversed only for explicit linked paths. detail is not accepted because /time always
        returns record envelopes.
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - name: q
        in: query
        description: Heurist search expression or JSON-encoded query object/array.
        schema:
          type: string
      - name: query
        in: query
        description: Preferred alias for q; a Heurist expression or JSON-encoded query object/array.
        schema:
          type: string
      - name: ids
        in: query
        description: Comma-separated seed record identifiers. Used when q/query is omitted.
        schema:
          type: string
        example: 123,456
      - name: timefields
        in: query
        description: >-
          Temporal fields to extract. Accepts a field ID, comma-separated field IDs, or linked path codes such as
          10:lt240:48:134. Requested terminal fields must be date or year fields. If omitted, all native date/year
          fields present on the returned top records are used.
        schema:
          type: string
      - name: fields
        in: query
        description: Optional /records field selection for the ordinary headers/details returned with each record.
        schema:
          type: string
      - name: resolveDetails
        in: query
        description: Resolve enum/file/geo and other supported detail values in the ordinary record details output.
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - name: sort
        in: query
        description: Sort expression using the same contract as /records.
        schema: {}
      - name: filter
        in: query
        description: Additional query predicate/group ANDed with the base query, using the /records contract.
        schema: {}
      responses:
        '200':
          description: Records response with timeline-compatible when arrays
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '422':
          description: Query uses an unsupported feature.
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
      - Timeline
      operationId: searchTimelinePost
      summary: Search records with temporal spans using a structured request
      description: >-
        POST form of the same /records temporal projection, suitable for JSON queries, field arrays, linked
        timefields, sort and filter structures. q/query/ids may be omitted to search all visible records.
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Database'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimelineSearchRequest'
      responses:
        '200':
          description: Records response with timeline-compatible when arrays
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '422':
          description: Query uses an unsupported feature.
        '500':
          $ref: '#/components/responses/ServerError'
