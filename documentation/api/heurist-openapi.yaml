openapi: 3.1.0
info:
  title: Heurist Read API
  version: 1.0.0-beta
  summary: Public read access to Heurist databases, records, database definitions, maps, timeline data, annotations
    and IIIF resources
  description: 'This specification describes the public read API currently exposed through

    `hserv/controller/api.php`.


    The compact, unversioned base URI is retained. Descriptive and abbreviated

    definition routes are equivalent aliases; neither form is deprecated.


    The modern definition collection envelope applies to server databases, record

    types, fields, terms, term links and record structures. Record responses retain the established

    `records` array and record/detail objects while adding metadata and pagination. Successful IIIF

    responses remain direct IIIF Presentation API resources and are never wrapped

    in a Heurist-specific envelope.



    Map and timeline endpoints return engine-neutral MapDocument, MapLayer, GeoJSON and temporal presentation resources.'
servers:
- url: https://{host}/api
  description: A Heurist installation
  variables:
    host:
      default: heuristref.net
      description: Host name of the Heurist server
tags:
- name: Databases
  description: List registered databases available on the server
- name: Records
  description: Search for and retrieve records
- name: Database structure
  description: Retrieve record types, fields, terms, term links and record structures
- name: Authentication
  description: Obtain JWT tokens or manage a browser-backed session
- name: IIIF
  description: Retrieve direct IIIF Presentation API v3 resources
- name: Annotations
  description: Read IIIF Web Annotation records and AnnotationPages
- name: Maps
  description: Retrieve public MapDocument and MapLayer definitions and geographic data as GeoJSON
- name: Timeline
  description: Retrieve public temporal data for Heurist record queries
paths:
  /databases:
    get:
      tags:
      - Databases
      operationId: listDatabases
      summary: List registered databases
      description: Server-level public route. No database path segment or authentication is required. Results use
        the standard collection envelope. Use details=full to include registration ID, title, rights and description.
      security:
      - {}
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/DatabaseDetails'
      - $ref: '#/components/parameters/RegisteredDatabaseIdFilter'
      responses:
        '200':
          description: Registered databases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
  /databases/{databaseName}:
    get:
      tags:
      - Databases
      operationId: getDatabase
      summary: Retrieve one registered database
      description: Server-level public route. The database is selected by its database name.
      security:
      - {}
      parameters:
      - $ref: '#/components/parameters/DatabaseName'
      - $ref: '#/components/parameters/DatabaseDetails'
      responses:
        '200':
          description: Registered database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseDefinition'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /dbs:
    get:
      tags:
      - Databases
      operationId: listDatabasesShortAlias
      summary: List registered databases using the short alias
      description: Equivalent alias of /databases.
      security:
      - {}
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/DatabaseDetails'
      - $ref: '#/components/parameters/RegisteredDatabaseIdFilter'
      responses:
        '200':
