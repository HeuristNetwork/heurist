      responses:
        '201':
          description: The new record.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordItemResponse'}
        '401':
          description: Not logged in
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordEditError'}
        '403':
          description: Not allowed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordEditError'}
        '404':
          description: Record does not exist or is not visible
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordEditError'}
        '415':
          description: Content-Type is not application/json
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordEditError'}
  /{database}/records/{recordId}/validate:
    post:
      tags:
      - Record editing
      operationId: validateRecord
      summary: Check a record without saving it
      description: >-
        Runs every check of a save (insert when recordId is 0 or negative, replace otherwise) and writes
        nothing.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/RecordWriteId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordInput'}
      responses:
        '200':
          description: The record can be saved; issues lists warnings.
          content:
            application/json:
              schema:
                type: object
                required: [valid, issues]
                properties:
                  valid: {type: boolean, const: true}
                  issues:
                    type: array
                    items: {$ref: '#/components/schemas/RecordIssue'}
        '400':
          description: Invalid body
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordEditError'}
        '401':
          description: Not logged in
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordEditError'}
        '403':
          description: Not allowed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordEditError'}
        '404':
          description: Record does not exist
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordEditError'}
        '415':
          description: Content-Type is not application/json
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordEditError'}
        '422':
          description: Invalid values
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordEditError'}
