  /{database}/map/{recordId}:
    get:
      tags:
      - Maps
      operationId: getRecordGeoJson
      summary: Retrieve geographic data for one record
      description: Returns a GeoJSON FeatureCollection for one visible Heurist record. Linked-place geometry may
        be included according to normal Heurist mapping rules.
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/RecordId'
      - name: geofields
        in: query
        description: >-
          Geographic detail fields to extract from this record, including explicit linked path codes. If omitted,
          all native geo fields present on the record are used.
        schema:
          type: string
      - name: extent
        in: query
        description: Optional viewport as west,south,east,north or a JSON array/object.
        schema:
          type: string
      - name: geoOutputMode
        in: query
        description: records combines geometry for the record; features emits individual geo occurrences.
        schema:
          type: string
          enum: [records, features]
          default: records
      - name: simplify
        in: query
        description: Simplify complex geometries when supported.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: GeoJSON for one record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapGeoJsonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
  /{database}/map:
    get:
      tags:
      - Maps
      operationId: searchMapGeoJson
      summary: Search geographic data
      description: >-
        Runs a Heurist record query and returns a GeoJSON FeatureCollection. Supply q/query, ids, or neither; when
        none is supplied all visible records are searched. geofields selects direct or linked geo fields. If omitted,
        all native geo fields present on the top records are used; linked records are traversed only for explicit
        linked paths. extent can constrain native geo searches or the terminal records of linked paths.
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - name: q
        in: query
        description: Heurist search expression or JSON-encoded query object/array.
        schema:
          type: string
      - name: query
        in: query
        description: Preferred alias for q; a Heurist expression or JSON-encoded query object/array.
        schema:
          type: string
      - name: ids
        in: query
        description: Comma-separated seed record identifiers. Used when q/query is omitted.
        schema:
          type: string
        example: 123,456
      - name: geofields
        in: query
        description: >-
          Geographic detail fields to extract. Accepts a field ID, comma-separated field IDs, linked path codes such
          as 10:lt240:48:134, or all. If omitted, all native geo fields present on the top records are used.
        schema:
          type: string
      - name: extent
        in: query
        description: >-
          Optional viewport as west,south,east,north or a JSON array/object. Native-only searches are constrained at
          the top query; linked geo paths apply the extent to their terminal expansion query.
        schema:
          type: string
      - name: geoOutputMode
        in: query
        description: records combines all geometry for each top record; features emits individual geo occurrences.
        schema:
          type: string
          enum: [records, features]
          default: records
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - name: simplify
        in: query
        description: Simplify complex geometries when supported.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: GeoJSON search result
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/MapGeoJsonResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/MapGeoJsonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
      - Maps
      operationId: searchMapGeoJsonPost
      summary: Search geographic data using a structured query
      description: >-
        POST form of the same map projection. Structured query, ids, geofields and extent values avoid URL-length
        restrictions. q/query/ids may be omitted to search all visible records.
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Database'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MapSearchRequest'
      responses:
        '200':
          description: GeoJSON search result
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/MapGeoJsonResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/MapGeoJsonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
  /{database}/map/data/{recordId}:
    get:
      tags:
      - Maps
      operationId: getMapDataSource
      summary: Retrieve a file-backed map datasource
      description: >-
        Retrieves or converts a map datasource record backed by KML, KMZ, CSV, TSV,
        GeoJSON, or SHP/DBF/SHX data. `format=geojson` converts supported source data
        to GeoJSON; `format=rawfile` returns a ZIP archive containing the source
        file(s), optionally with metadata; `format=source` proxies the original
        source representation (shapefiles are returned as ZIP because they are
        intrinsically multi-file). This route is GET-only.
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/RecordId'
      - name: format
        in: query
        description: Output representation. Defaults to geojson.
        schema:
          type: string
          enum: [geojson, rawfile, source]
          default: geojson
      - name: simplify
        in: query
        description: Simplify complex geometry during conversion. Datasource conversion defaults to true; set false to disable.
        schema:
          type: boolean
          default: true
      - name: metadata
        in: query
        description: When format=rawfile, include a metadata text file in the returned ZIP archive.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Converted GeoJSON, original datasource content, or a raw datasource ZIP archive.
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/MapDataGeoJsonResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/MapDataGeoJsonResponse'
            application/zip:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
            text/tab-separated-values:
              schema:
                type: string
            application/vnd.google-earth.kml+xml:
              schema:
                type: string
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
