  /{database}/jobs:
    get:
      tags:
      - Jobs
      operationId: listJobs
      summary: List background jobs
      description: >-
        Jobs of the current user, newest first. The database owner and administrators may ask for every job with
        all=1. Logged-in users only. Job files are kept for 7 days.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - name: all
        in: query
        description: Every job of the database (owner and administrators only).
        schema:
          type: boolean
      - name: type
        in: query
        description: Only jobs of this type (e.g. export).
        schema:
          type: string
      - name: brief
        in: query
        description: Leave out the stored parameters of each job (small answer for lists).
        schema:
          type: boolean
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 0
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Jobs
      operationId: startJob
      summary: Start a background job
      description: >-
        Validates the parameters, creates the job and answers 202 with the queued job; the connection is closed and
        the same server process runs the job. Poll GET /jobs/{jobId} for progress. Job types: export (record export
        into a file, parameters ExportJobParams), report-preview and report-generate (Smarty reports). One active
        job of the same type per user (a second start is refused with 403; a report-preview replaces the older one)
        and at most maxJobs active jobs per database. Record export has no streaming endpoint by design: a job has
        limits, Stop, progress and a result file that only its owner can download.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Database'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              - params
              properties:
                type:
                  type: string
                  enum:
                  - export
                  - report-preview
                  - report-generate
                params:
                  oneOf:
                  - $ref: '#/components/schemas/ExportJobParams'
                  - type: object
                    description: Parameters of the report job types.
            example:
              type: export
              params:
                format: csv
                scope:
                  query: t:10
                columns:
                  '10':
                  - '1'
                  - field: '20'
                    ext: code
                values:
                  date: start
                limit: 1000
                fileName: Persons
      responses:
        '202':
          description: The queued job (it runs after the response)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 0
                  data:
                    $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            A job of this type is already running for the user, too many jobs run in the database, or the export
            has more records than the database maximum (setting Export maxRecords).
  /{database}/jobs/{jobId}:
    get:
      tags:
      - Jobs
      operationId: getJob
      summary: State and progress of a job
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: The job
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 0
                  data:
                    $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Jobs
      operationId: deleteJob
      summary: Remove a finished job and its result file
      description: The job's owner (or the database owner and administrators); a running job must be stopped first.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 0
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      deleted:
                        type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The job is still running, or belongs to another user.
        '404':
          $ref: '#/components/responses/NotFound'
  /{database}/jobs/{jobId}/cancel:
    post:
      tags:
      - Jobs
      operationId: cancelJob
      summary: Stop a job
      description: Asks the job to stop at its next check and stops its current SQL statement (KILL QUERY).
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: The job with cancelRequested
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 0
                  data:
                    $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /{database}/jobs/{jobId}/result:
    get:
      tags:
      - Jobs
      operationId: getJobResult
      summary: Result of a finished job
      description: >-
        For an export the result file is sent as an attachment (Content-Disposition), only to the user who started
        the job. For a report preview the result is HTML.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: The result file or content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The file belongs to another user.
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT supplied in the Authorization header. Existing Heurist browser sessions may also be recognised.
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      description: Job id (32 hexadecimal characters).
      schema:
        type: string
        pattern: ^[a-f0-9]{32}$
    Database:
      name: database
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      example: my_database
    DatabaseName:
      name: databaseName
      in: path
      required: true
      description: Heurist database name as returned in sys_Database.
      schema:
        type: string
        minLength: 1
      example: my_database
    DatabaseDetails:
      name: details
      in: query
      description: Return only database names with id, or full database registration information with full.
      schema:
        type: string
        enum:
        - id
        - full
        default: id
    RegisteredDatabaseIdFilter:
      name: sys_dbRegisteredID
      in: query
      description: Filter by registered database ID. Comparison syntax such as >0 is accepted.
      schema:
        type: string
      example: '>0'
    RecordId:
      name: recordId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    RecordWriteId:
      name: recordId
      in: path
      required: true
      description: Record id. On insert (POST) 0 takes the next id and a negative value gives the id (import).
      schema:
        type: integer
    RecordForce:
      name: force
      in: query
      description: >-
        PUT/PATCH - save even when rec_Modified differs (overwrites another change). DELETE - remove the
        references (pointer values in other records, relationship records) and delete.
      schema:
        type: boolean
        default: false
    ReportRef:
      name: reportRef
      in: path
      required: true
      description: Report record id or template file name (URL-encoded).
      schema:
        type: string
    RecordTypeId:
      name: recordTypeId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    FieldId:
      name: fieldId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    TermId:
      name: termId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    IiifIdentifier:
      name: identifier
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 1000
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Details:
      name: details
      in: query
      description: Entity-specific response projection. Existing DbDefXXX modes remain available; commonly used
        values include id, name, list, full, raw and structure where supported.
      schema:
        type: string
  schemas:
    Job:
      type: object
      description: State of a background job.
      properties:
        id:
          type: string
          example: 3f2a9c0d4b1e4c7a9e5d2b6c8a1f0e3d
        type:
          type: string
          example: export
        userId:
          type: integer
        title:
          type: string
          example: 'Export CSV: Persons'
        status:
          type: string
          enum:
          - queued
          - running
          - done
          - failed
          - cancelled
          - timeout
          - lost
        progress:
          type: object
          properties:
            done:
              type: integer
            total:
              type: integer
              description: 0 when unknown.
            message:
              type: string
              example: writing records
        params:
          type: object
        limitSeconds:
          type: integer
        createdAt:
          type: integer
        startedAt:
          type: integer
          nullable: true
        finishedAt:
          type: integer
          nullable: true
        elapsedSeconds:
          type: integer
        cancelRequested:
          type: boolean
        result:
          type: object
          nullable: true
          description: >-
            Export - file, size, records, format, rectypes (records per record type), mime and download (true -
            GET /jobs/{jobId}/result sends the file).
        error:
          type: string
          nullable: true
    ExportJobParams:
      type: object
      description: >-
        Parameters of the job type "export". Every record is written once, the result first, then the records the
        expansion rules reach. Column field codes are the codes of the /records fields parameter.
      required:
      - format
      - scope
      properties:
        format:
          type: string
          enum:
          - csv
          - tsv
          - json
          - geojson
          - kml
          - xml
          - gephi
          description: >-
            csv/tsv - one table per record type (a zip for several), first column H-ID; json - the /records
            envelope, the same as /records?fields=_all&defs=1 (with names - also resolveDetails=1), plus
            meta.title, meta.exported and meta.total; geojson - one feature per record with
            geometry; kml - one Placemark per geo value; xml - flat HML that the HML import reads; gephi - GEXF 1.2.
        scope:
          type: object
          properties:
            query:
              description: Query of the data source (text or JSON query array).
            ids:
              type: array
              items:
                type: integer
              description: Selected records (instead of the whole result).
            rectypes:
              type: array
              items:
                type: integer
              description: Only these record types of the result.
        rules:
          description: Expansion rules (DataSource rules or a compact path). Omit for the result only.
        columns:
          type: object
          description: >-
            Output fields per record type id; "*" for every record type without its own list. Required for
            csv/tsv; properties for geojson/kml, node attributes for gephi; json and xml export all fields.
          additionalProperties:
            type: array
            items:
              oneOf:
              - type: string
                example: '10:lf134:12:1'
              - type: object
                properties:
                  field:
                    type: string
                  ext:
                    type: string
                    enum:
                    - term
                    - code
                    - conceptid
                    - desc
                    - internalid
        values:
          type: object
          properties:
            date:
              type: string
              enum:
              - asis
              - start
              - range
            file:
              type: string
              enum:
              - url
              - id
              - details
            pointer:
              type: string
              enum:
              - id
              - title
            enum:
              type: string
              enum:
              - term
              - code
              - conceptid
              - desc
              - internalid
        csv:
          type: object
          properties:
            sep:
              type: string
              description: One character, or "tab".
              example: ','
            quote:
              type: string
              description: One character, or "none".
              example: '"'
            mvsep:
              type: string
              description: Separator of repeated values.
              example: '|'
            header:
              type: boolean
            eol:
              type: string
              enum:
              - nix
              - win
        limit:
          type: integer
          description: Records of the result (0 = all, up to the database setting Export maxRecords).
        fileName:
          type: string
          description: Download name without extension (A-Za-z0-9 space - _ ( )).
        title:
          type: string
          description: Caption of the job (data source title).
    Error:
      type: object
      required:
      - status
      - error
      - message
      properties:
        status:
          type: integer
          description: HTTP response status code.
          example: 404
        error:
          type: string
          description: Heurist API response status constant defined in consts.php.
          enum:
          - invalid
          - notfound
          - denied
          - blocked
          - error
          - database
          - syscfg
          - system
          - network
          - unknown
          example: notfound
        message:
          type: string
          example: Definition not found
      additionalProperties: false
    DatabaseDefinition:
      type: object
      required:
      - sys_Database
      properties:
        sys_Database:
          type: string
          description: Database name used in API path segments.
        sys_dbRegisteredID:
          type: integer
          description: Registered database identifier.
        sys_dbName:
          type: string
          description: Display name of the database.
        sys_dbRights:
          type: string
        sys_dbDescription:
          type: string
      additionalProperties: true
    DatabaseMeta:
      type: object
      required:
      - database
      - entity
      properties:
        database:
          type: 'null'
          description: Always null because database listing is a server-level request.
        entity:
          type: string
          const: databases
      additionalProperties: false
    DatabaseSearchResponse:
      type: object
      required:
      - items
      - meta
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DatabaseDefinition'
        meta:
          $ref: '#/components/schemas/DatabaseMeta'
        pagination:
          $ref: '#/components/schemas/Pagination'
      additionalProperties: false
    Definition:
      type: object
      additionalProperties: true
    DefinitionMeta:
      type: object
      required:
      - database
      - entity
      properties:
        database:
          type: string
        entity:
          type: string
          enum:
          - rectypes
          - fields
          - terms
          - termlinks
          - recstructure
        recordTypeId:
          type: integer
          minimum: 1
      additionalProperties: false
    Pagination:
      type: object
      required:
      - total
      - offset
      - limit
      - self
      - next
      properties:
        total:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 1000
        self:
          type: string
          format: uri
        next:
          oneOf:
          - type: string
            format: uri
          - type: 'null'
      additionalProperties: false
    DefinitionCollection:
      type: object
      required:
      - items
      - meta
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Definition'
        meta:
          $ref: '#/components/schemas/DefinitionMeta'
        pagination:
          $ref: '#/components/schemas/Pagination'
      additionalProperties: false
    TermLink:
      type: object
      required:
      - trl_ParentID
      - trl_TermID
      properties:
        trl_ParentID:
          type: integer
          minimum: 1
          description: Parent term or vocabulary ID stored in `defTermsLinks`.
        trl_TermID:
          type: integer
          minimum: 1
          description: Linked term ID stored in `defTermsLinks`.
      additionalProperties: false
    TermTreeNode:
      type: object
      required:
        - id
        - label
        - parentId
        - children
      properties:
        id:
          type: integer
          minimum: 1
        label:
          type: string
        parentId:
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'
          description: Real parent ID, even when this node is included by reference under another parent.
        children:
          type: array
          items:
            $ref: '#/components/schemas/TermTreeNode'
      additionalProperties: false
    TermTreeSearchResponse:
      type: object
      required:
        - items
        - meta
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TermTreeNode'
        meta:
          $ref: '#/components/schemas/TermLinkMeta'
        pagination:
          $ref: '#/components/schemas/Pagination'
      additionalProperties: false
    TermLinkMeta:
      type: object
      required:
      - database
      - entity
      properties:
        database:
          type: string
        entity:
          type: string
          const: termlinks
      additionalProperties: false
    TermLinkSearchResponse:
      type: object
      required:
      - items
      - meta
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TermLink'
        meta:
          $ref: '#/components/schemas/TermLinkMeta'
        pagination:
          $ref: '#/components/schemas/Pagination'
      additionalProperties: false
    SystemRecord:
      type: object
      required: [rec_ID, rec_RecTypeID, rec_Title]
      properties:
        rec_ID: {type: integer, minimum: 0, description: 'Group 0 is the legacy "Everyone" scope.'}
        rec_RecTypeID: {type: string, enum: [filter, user, group, tag, bookmark, reminder]}
        rec_Title: {type: string}
        rec_Modified: {type: string}
        rec_OwnerUGrpID: {type: integer}
        details:
          type: object
          description: Resolved logical fields; filter supports query, user supports email, group supports role.
          additionalProperties:
            type: array
            items:
              type: object
              required: [value]
              properties:
                value: {}
              additionalProperties: false
      additionalProperties: false
    SystemRecordsMeta:
      type: object
      required: [database, entity, type, fields]
      properties:
        database: {type: string}
        entity: {type: string, const: sys}
        type: {type: string, enum: [filter, user, group, tag, bookmark, reminder]}
        currentUser:
          type: object
          description: User and group responses only - the caller and whether they administer the database.
          required: [id, isAdmin]
          properties:
            id: {type: integer, minimum: 0}
            isAdmin: {type: boolean}
          additionalProperties: false
        fields:
          type: object
          required: [headers, details]
          properties:
            headers:
              type: array
              items: {type: string}
            details:
              type: array
              items:
                type: object
                additionalProperties: true
          additionalProperties: false
      additionalProperties: false
    SystemSearchResponse:
      type: object
      required: [records, meta, pagination]
      properties:
        records:
          type: array
          items: {$ref: '#/components/schemas/SystemRecord'}
        meta: {$ref: '#/components/schemas/SystemRecordsMeta'}
        pagination: {$ref: '#/components/schemas/Pagination'}
      additionalProperties: false
    SystemQueryResponse:
      oneOf:
      - $ref: '#/components/schemas/SystemSearchResponse'
      - $ref: '#/components/schemas/RecordIdsResponse'
    SystemSearchRequest:
      type: object
      properties:
        query: {}
        q: {}
        ids:
          oneOf:
          - {type: string}
          - type: array
            items: {type: integer, minimum: 1}
        fields:
          oneOf:
          - {type: string}
          - type: array
            items: {type: string}
        detail: {type: string, enum: [records, ids], default: records}
        limit: {type: integer, minimum: 1, maximum: 100000, default: 1000}
        offset: {type: integer, minimum: 0, default: 0}
        sort: {}
        filter: {}
      additionalProperties: false
    Record:
      type: object
      description: >-
        A Heurist record envelope. rec_ID, rec_RecTypeID and rec_Title are mandatory. The details object contains only
        explicitly requested native or linked fields.
      required:
      - rec_ID
      - rec_RecTypeID
      - rec_Title
      properties:
        rec_ID:
          type: string
        rec_RecTypeID:
          type: string
        rec_Title:
          oneOf:
          - type: string
          - type: 'null'
        details:
          $ref: '#/components/schemas/RecordDetails'
      additionalProperties: true
    RecordSearchResponse:
      type: object
      required:
      - records
      - meta
      - pagination
      properties:
        records:
          type: array
          description: Record envelopes in top-query order.
          items:
            $ref: '#/components/schemas/Record'
        meta:
          $ref: '#/components/schemas/RecordsMeta'
        pagination:
          $ref: '#/components/schemas/Pagination'
      additionalProperties: false
    RecordQueryResponse:
      description: Response selected by the requested detail mode.
      oneOf:
      - $ref: '#/components/schemas/RecordSearchResponse'
      - $ref: '#/components/schemas/RecordIdsResponse'
    RecordAggregateResponse:
      description: Response selected by op (count, rectypes, values, minmax, ranges).
      oneOf:
      - $ref: '#/components/schemas/RecordCountResponse'
      - $ref: '#/components/schemas/RecordRectypeCountsResponse'
      - $ref: '#/components/schemas/RecordValuesResponse'
      - $ref: '#/components/schemas/RecordValueRangeResponse'
      - $ref: '#/components/schemas/RecordValueBucketsResponse'
    RecordValueBucketsResponse:
      type: object
      description: >-
        op=ranges. Non-empty ranges from the smallest to the largest value. from/to are in the form record
        search accepts (detail dates: years for year-based ranges, ISO dates for months; header dates: ISO
        dates; numbers: numbers): a filter uses <>from/to, ><from/to or from/to for dates and from<>to for
        numbers. When a grouping would give more than 1000 ranges (months across millennia, prehistoric
        years), only the ranges holding the start or end of some value are listed, at most 1000 (truncated).
      required: [query, field, type, match, total, truncated, buckets]
      properties:
        query:
          description: Query representation supplied by the caller.
          oneOf:
          - type: string
          - type: object
            additionalProperties: true
          - type: array
            items:
              type: object
              additionalProperties: true
        field:
          type: string
        type:
          type: string
          enum: [number, date]
        groupby:
          type: string
          description: Dates only.
        ranges:
          type: integer
          description: Numbers only.
        match:
          type: string
          enum: [overlap, within]
        total:
          type: integer
          minimum: 0
          description: Number of matching records that have a value.
        truncated:
          type: boolean
        buckets:
          type: array
          items:
            type: object
            required: [from, to, label, count]
            properties:
              from:
                oneOf:
                - type: number
                - type: string
              to:
                oneOf:
                - type: number
                - type: string
              label:
                type: string
              count:
                type: integer
                minimum: 1
    RecordValueRangeResponse:
      type: object
      description: >-
        op=minmax. Numeric bounds are numbers. Date bounds are ISO dates (YYYY-MM-DD; years before 1 as
        -YYYY-MM-DD) from the estimated span of each date, so fuzzy and ranged dates widen the bounds; a lower
        bound without month or day starts the period and an upper bound ends it. Bounds are null without values.
      required: [query, field, type, min, max, count]
      properties:
        query:
          description: Query representation supplied by the caller.
          oneOf:
          - type: string
          - type: object
            additionalProperties: true
          - type: array
            items:
              type: object
              additionalProperties: true
        field:
          type: string
        type:
          type: string
          enum: [number, date]
        min:
          nullable: true
          oneOf:
          - type: number
          - type: string
        max:
          nullable: true
          oneOf:
          - type: number
          - type: string
        count:
          type: integer
          minimum: 0
          description: Number of matching records that have a value.
    RecordValuesResponse:
      type: object
      required: [query, field, total, values]
      properties:
        query:
          description: Query representation supplied by the caller.
          oneOf:
          - type: string
          - type: object
            additionalProperties: true
          - type: array
            items:
              type: object
              additionalProperties: true
        field:
          type: string
        total:
          type: integer
          minimum: 0
          description: Number of distinct values (may exceed the values returned).
        values:
          type: array
          items:
            type: object
            required: [value, count]
            properties:
              value:
                oneOf:
                - type: integer
                - type: string
              count:
                type: integer
                minimum: 1
              label:
                type: string
              rty:
                type: integer
              kind:
                type: string
                enum: [user, group]
            additionalProperties: false
      additionalProperties: false
    RecordCountResponse:
      type: object
      required: [query, total]
      properties:
        query:
          description: Query representation supplied by the caller, or the normalized IDs/all query.
          oneOf:
          - type: string
          - type: object
            additionalProperties: true
          - type: array
            items:
              type: object
              additionalProperties: true
        total:
          type: integer
          minimum: 0
      additionalProperties: false
    RecordRectypeCountsResponse:
      type: object
      required: [query, total, rectypes]
      properties:
        query:
          description: Query representation supplied by the caller, or the normalized IDs/all query.
          oneOf:
          - type: string
          - type: object
            additionalProperties: true
          - type: array
            items:
              type: object
              additionalProperties: true
        total:
          type: integer
          minimum: 0
        rectypes:
          type: array
          items:
            type: object
            required: [rec_RecTypeID, count]
            properties:
              rec_RecTypeID:
                type: integer
                minimum: 1
              count:
                type: integer
                minimum: 1
            additionalProperties: false
      additionalProperties: false
    RecordIdsResponse:
      type: object
      required:
      - ids
      - total
      - offset
      - limit
      - resultToken
      properties:
        ids:
          type: array
          items:
            type: integer
        total:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        resultToken:
          oneOf:
          - type: string
          - type: 'null'
      additionalProperties: false
    RecordSearchRequest:
      type: object
      properties:
        query:
          oneOf:
          - type: string
          - type: object
            additionalProperties: true
          - type: array
            items:
              type: object
              additionalProperties: true
        q:
          oneOf:
          - type: string
          - type: object
            additionalProperties: true
          - type: array
            items:
              type: object
              additionalProperties: true
          description: Alias for query.
        ids:
          oneOf:
          - type: string
          - type: array
            items:
              type: integer
              minimum: 1
        fields:
          oneOf:
          - type: string
          - type: array
            uniqueItems: true
            items:
              type: string
        detail:
          type: string
          enum: [records, ids]
          default: records
        resolveDetails:
          type: boolean
          default: false
        defs:
          type: boolean
          default: false
          description: Add meta.recordTypes and meta.terms (see the defs query parameter).
        limit:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1000
        offset:
          type: integer
          minimum: 0
          default: 0
      additionalProperties: false
    RecordAggregateRequest:
      type: object
      required: [op]
      description: Body of POST /records/aggregate and /files/aggregate; see GET /records/aggregate for the parameters.
      properties:
        op:
          type: string
          enum: [count, rectypes, values, minmax, ranges]
        query:
          oneOf:
          - type: string
          - type: object
            additionalProperties: true
          - type: array
            items:
              type: object
              additionalProperties: true
        q:
          description: Alias for query.
        ids:
          oneOf:
          - type: string
          - type: array
            items:
              type: integer
              minimum: 1
        filter:
          description: Additional query ANDed with the query.
        field:
          type: string
        text:
          type: string
        via:
          type: array
          items:
            type: object
            additionalProperties: true
        sort:
          type: string
          enum: [count, value]
        groupby:
          type: string
          enum: [month, year, decade, century]
        ranges:
          type: integer
          minimum: 1
          maximum: 20
        match:
          type: string
          enum: [overlap, within]
        limit:
          type: integer
          minimum: 1
          maximum: 1000
        offset:
          type: integer
          minimum: 0
        debug:
          type: integer
          enum: [1, 2]
        rid:
          type: string
          description: Request id, for POST /records/cancel.
      additionalProperties: false
    GraphRequest:
      type: object
      properties:
        query:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
            - type: array
              items:
                type: object
                additionalProperties: true
        q:
          description: Alias for query.
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
            - type: array
              items:
                type: object
                additionalProperties: true
        ids:
          oneOf:
            - type: string
            - type: array
              items:
                type: integer
                minimum: 1
        links:
          description: >-
            "all", a comma-separated list, or an array of compact link specs. Edges connect only records within
            the seed set. Omission returns nodes without edges.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        rule:
          description: >-
            One optional compact traversal step or JSON rule with query and no nested levels.
            Execute against the query's seed IDs; the response's expansion.targetIds is the next frontier.
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
        limit:
          type: integer
          minimum: 1
          maximum: 10000
          default: 1000
        offset:
          type: integer
          minimum: 0
          default: 0
        limits:
          type: object
          properties:
            maxNodes:
              type: integer
              minimum: 1
              maximum: 10000
            maxEdges:
              type: integer
              minimum: 1
              maximum: 10000
            maxDepth:
              type: integer
              minimum: 1
              maximum: 10
          additionalProperties: false
        rules:
          description: Legacy alias for rule; arrays may contain at most one rule. Not currently executed.
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
            - type: array
              maxItems: 1
              items:
                oneOf:
                  - type: string
                  - type: object
                    additionalProperties: true
      additionalProperties: false
    GraphDocument:
      type: object
      required: [query, total, offset, limit, graph]
      properties:
        expansion:
          description: Present for a rule request; null for an initial graph. Contains only matched target IDs, including targets also present in the seed set.
          oneOf:
            - type: 'null'
            - type: object
              required: [targetIds]
              properties:
                targetIds:
                  type: array
                  items: {type: integer}
        query:
          description: The caller's original query representation.
          oneOf:
          - type: string
          - type: object
            additionalProperties: true
          - type: array
            items:
              additionalProperties: true
        total:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        graph:
          type: object
          required: [records, edges, links, paths, limits]
          properties:
            records:
              type: array
              items:
                type: object
                required: [rec_ID, rec_Title, rec_RecTypeID]
                properties:
                  rec_ID: {type: integer}
                  rec_Title: {type: string}
                  rec_RecTypeID: {type: integer}
                additionalProperties: false
            edges:
              type: array
              items:
                type: object
                required: [id, source, target, field, relationship, link, path]
                properties:
                  id: {type: string}
                  source: {type: integer}
                  target: {type: integer}
                  field:
                    oneOf: [{type: integer}, {type: 'null'}]
                  relationship:
                    oneOf: [{type: integer}, {type: 'null'}]
                  link:
                    description: Key into the links map for an initial link edge, else null.
                    oneOf: [{type: string}, {type: 'null'}]
                  path:
                    description: Key into the paths map for an expansion edge, else null.
                    oneOf: [{type: string}, {type: 'null'}]
                additionalProperties: false
            links:
              type: object
              description: Link key to compact link spec. Empty for links=all.
              additionalProperties: {type: string}
            paths:
              type: object
              description: Path key to compact traversal expression.
              additionalProperties: {type: string}
            limits:
              type: object
              required: [maxNodes, maxEdges, maxDepth, nodesReturned, edgesReturned, truncated]
              properties:
                maxNodes: {type: integer}
                maxEdges: {type: integer}
                maxDepth: {type: integer}
                nodesReturned: {type: integer}
                edgesReturned: {type: integer}
                truncated: {type: boolean}
              additionalProperties: false
          additionalProperties: false
      additionalProperties: false
    RecordItemMeta:
      type: object
      required:
      - database
      - entity
      properties:
        database:
          type: string
        entity:
          type: string
          const: records
        self:
          type: string
          format: uri
        fields:
          $ref: '#/components/schemas/RecordFieldsMeta'
        recordTypes:
          type: object
          description: defs=1 only. Record types used by the records, keyed by rty_ID.
          additionalProperties:
            type: object
            properties:
              rty_Name: {type: string}
              rty_ConceptCode: {type: string}
        terms:
          type: object
          description: defs=1 only. Terms of enum and relationtype values, keyed by trm_ID.
          additionalProperties:
            type: object
            properties:
              trm_Label: {type: string}
              trm_Code: {type: string}
              trm_ConceptCode: {type: string}
        issues:
          type: array
          description: Record writes only - warnings of the save (validation, workflow).
          items: {$ref: '#/components/schemas/RecordIssue'}
      additionalProperties: false
    RecordItemResponse:
      type: object
      required:
      - records
      - meta
      properties:
        records:
          type: array
          maxItems: 1
          description: One record object, one record ID when detail=ids, or an empty array when missing or inaccessible.
          items:
            oneOf:
            - $ref: '#/components/schemas/Record'
            - type: integer
            - type: string
        meta:
          $ref: '#/components/schemas/RecordItemMeta'
      additionalProperties: false
    RecordInput:
      type: object
      description: >-
        A record to write - the record object of GET /records/{recordId}. A bare record or {records:[record]}.
        Read-only headers of the GET output (rec_Title, rec_Added, rec_AddedByUGrpID, rec_Hash,
        rec_FlagTemporary, virtual headers) are ignored. The legacy recordSave format (headers without rec_,
        details keyed "t:NNN") is refused.
      properties:
        rec_ID: {type: [string, integer], description: Must equal the recordId of the URL when given.}
        rec_RecTypeID: {type: [string, integer], description: Required on insert; cannot be changed.}
        rec_OwnerUGrpID: {type: [string, integer]}
        rec_NonOwnerVisibility: {type: string, enum: [viewable, hidden, public, pending]}
        rec_NonOwnerVisibilityGroups:
          type: array
          description: Groups that may view the record (visibility viewable).
          items: {type: [string, integer]}
        rec_EditGroups:
          type: array
          description: Groups that may change the record besides the owner.
          items: {type: [string, integer]}
        rec_URL: {type: [string, 'null']}
        rec_ScratchPad: {type: [string, 'null']}
        rec_Modified:
          type: string
          description: Value of the loaded record; a different stored value gives 409 (concurrency check).
        details:
          type: object
          description: >-
            Arrays of values keyed by field id. Values in the compact form (term id, record id, ulf_ID, text,
            date string or temporal JSON) or the resolved object form of GET (value, trm_ID, rec_ID, ulf_ID or
            file.ulf_ID are read); geo {geo:{type, wkt}} or WKT. {..., hidden:true} hides the value from the
            public. DT_NAME, DT_SHORT_SUMMARY and DT_EXTENDED_DESCRIPTION may have translations as further
            values with a language prefix ("fre:...").
          additionalProperties:
            type: array
            items: {$ref: '#/components/schemas/RecordDetailValue'}
      additionalProperties: false
    RecordIssue:
      type: object
      required: [field, code, severity, message]
      properties:
        field: {type: string, description: Field id or header name (rec_*).}
        index: {type: [integer, 'null'], description: Position of the value in the field.}
        code:
          type: string
          description: >-
            required, type, vocabulary, pointer, file, geo, length, date, max, language, forbidden,
            unknown_field, not_in_structure, rectype, owner, visibility, workflow
        severity: {type: string, enum: [error, warning]}
        message: {type: string}
    RecordEditError:
      type: object
      required: [status, error, message]
      properties:
        status: {type: integer}
        error:
          type: string
          enum: [invalid_request, access_denied, not_found, conflict, references, unsupported_media_type,
            validation, method_not_allowed, server_error]
        message: {type: string}
        errors:
          type: array
          description: 422 - the issues of the record.
          items: {$ref: '#/components/schemas/RecordIssue'}
        rec_Modified: {type: string, description: 409 conflict - the stored value.}
      additionalProperties: true
    RecordReferences:
      type: object
      properties:
        pointers:
          type: array
          items:
            type: object
            properties:
              rec_ID: {type: string}
              rec_RecTypeID: {type: string}
              rec_Title: {type: string}
              dty_ID: {type: string}
        relationships:
          type: array
          items:
            type: object
            properties:
              rec_ID: {type: string, description: Relationship record}
              source: {type: string}
              target: {type: string}
              relationType: {type: [string, 'null']}
    RecordDeleteResponse:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: array
          description: The record and the relationship records deleted with it.
          items: {type: string}
        pointersRemoved: {type: integer}
        relationshipsDeleted: {type: integer}
        bookmarks: {type: integer}
    ReportResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: integer, const: 0}
        data: {}
    ApiError:
      type: object
      required: [status, error, message]
      properties:
        status: {type: integer}
        error: {type: string, description: 'invalid_request, access_denied, not_found, method_not_allowed, server_error'}
        message: {type: string}
    SessionLoginRequest:
      type: object
      required:
      - login
      - password
      properties:
        login:
          type: string
        password:
          type: string
          format: password
    IiifResource:
      type: object
      additionalProperties: true
    RecordDetails:
      type: object
      description: >-
        Map keyed by the exact requested detail ID or dty_PathCode. Each field contains an ordered array of stored or
        resolved values. Linked values always include path provenance.
      additionalProperties:
        type: array
        items:
          $ref: '#/components/schemas/RecordDetailValue'
    RecordDetailValue:
      oneOf:
      - type: string
      - type: number
      - type: boolean
      - type: object
        description: >-
          A resolved or structured detail. `value` is the stored value. Type-specific properties use standard
          rec_*, trm_* or ulf_* names. Linked values additionally contain `path`.
        properties:
          value: {}
          path:
            $ref: '#/components/schemas/RecordDetailPath'
        additionalProperties: true
    RecordDetailPath:
      type: object
      required:
      - id
      - recordIDs
      properties:
        id:
          type: string
        recordIDs:
          type: array
          items:
            type: string
      additionalProperties: false
    RecordDetailField:
      type: object
      required:
      - dty_ID
      - dty_Name
      - dty_Type
      properties:
        dty_ID:
          type: string
        dty_Name:
          type: string
        dty_Type:
          type: string
        dty_ConceptCode:
          oneOf:
          - type: string
          - type: 'null'
        dty_PathCode:
          type: string
      additionalProperties: false
    RecordFieldsMeta:
      type: object
      required:
      - headers
      - details
      properties:
        headers:
          type: array
          items:
            type: string
        details:
          type: array
          description: Definitions of the requested fields; with fields=_all, of every field present in the records.
          items:
            $ref: '#/components/schemas/RecordDetailField'
      additionalProperties: false
    RecordsMeta:
      type: object
      required:
      - database
      - entity
      - fields
      properties:
        database:
          type: string
        entity:
          type: string
          const: records
        fields:
          $ref: '#/components/schemas/RecordFieldsMeta'
        paths:
          type: object
          description: Reusable linked traversal definitions keyed by the path ID stored beside linked values.
          additionalProperties:
            type: string
        recordTypes:
          type: object
          description: defs=1 only. Record types used by the records, keyed by rty_ID.
          additionalProperties:
            type: object
            properties:
              rty_Name: {type: string}
              rty_ConceptCode: {type: string}
        terms:
          type: object
          description: defs=1 only. Terms of enum and relationtype values, keyed by trm_ID.
          additionalProperties:
            type: object
            properties:
              trm_Label: {type: string}
              trm_Code: {type: string}
              trm_ConceptCode: {type: string}
      additionalProperties: false
    MapSearchRequest:
      type: object
      properties:
        query:
          oneOf:
          - type: object
            additionalProperties: true
          - type: array
            items:
              type: object
              additionalProperties: true
          - type: string
          description: Serialisable Heurist query. Omit with q/ids to search all visible records.
        q:
          oneOf:
          - type: object
            additionalProperties: true
          - type: array
            items:
              type: object
              additionalProperties: true
          - type: string
          description: Alias for query.
        ids:
          oneOf:
          - type: string
          - type: array
            items:
              type: integer
              minimum: 1
        geofields:
          description: >-
            Geo field IDs/path codes, all, a comma-separated string, or an array. Omission means all native geo
            fields found on the top records.
          oneOf:
          - type: string
          - type: array
            items:
              oneOf:
              - type: string
              - type: integer
        extent:
          description: west,south,east,north as a string, four-item array, or object with west/south/east/north.
          oneOf:
          - type: string
          - type: array
            minItems: 4
            maxItems: 4
            items: {type: number}
          - type: object
            required: [west, south, east, north]
            properties:
              west: {type: number}
              south: {type: number}
              east: {type: number}
              north: {type: number}
            additionalProperties: false
        geoOutputMode:
          type: string
          enum: [records, features]
          default: records
        limit:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1000
        offset:
          type: integer
          minimum: 0
          default: 0
        simplify:
          type: boolean
          default: false
      additionalProperties: false
    TimelineSearchRequest:
      type: object
      properties:
        query:
          oneOf:
          - type: string
          - type: object
            additionalProperties: true
          - type: array
            items:
              type: object
              additionalProperties: true
        q:
          description: Alias for query.
          oneOf:
          - type: string
          - type: object
            additionalProperties: true
          - type: array
            items:
              type: object
              additionalProperties: true
        ids:
          oneOf:
          - type: string
          - type: array
            items:
              type: integer
              minimum: 1
        timefields:
          description: >-
            Date/year field IDs or linked path codes. Accepts a comma-separated string or an array. Omission means
            all native date/year fields found on the returned top records.
          oneOf:
          - type: string
          - type: array
            items:
              oneOf:
              - type: string
              - type: integer
        fields:
          description: Ordinary /records output-field selection.
          oneOf:
          - type: string
          - type: array
            uniqueItems: true
            items:
              type: string
        resolveDetails:
          type: boolean
          default: false
        limit:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1000
        offset:
          type: integer
          minimum: 0
          default: 0
        sort: {}
        filter: {}
      additionalProperties: false
    TermDescriptor:
      type:
      - object
      - 'null'
      properties:
        id:
          type: integer
          minimum: 1
        code:
          type:
          - string
          - 'null'
        label:
          type:
          - string
          - 'null'
      required:
      - id
      - code
      - label
      additionalProperties: false
    MapBookmark:
      type:
      - object
      - 'null'
      description: Original map bookmark plus parsed values where recognised. Zoom values retain Heurist semantics.
      properties:
        raw:
          type: string
        type:
          type: string
        bounds:
          type: object
          properties:
            west:
              type: number
            south:
              type: number
            east:
              type: number
            north:
              type: number
          required:
          - west
          - south
          - east
          - north
          additionalProperties: false
        point:
          type: object
          properties:
            latitude:
              type: number
            longitude:
              type: number
          required:
          - latitude
          - longitude
          additionalProperties: false
        minimumZoom:
          type:
          - number
          - 'null'
        maximumZoom:
          type:
          - number
          - 'null'
        zoom:
          type:
          - number
          - 'null'
      required:
      - raw
      - type
      additionalProperties: true
    MapDocumentLayerReference:
      type: object
      required:
      - id
      - recordId
      - title
      - order
      - visible
      properties:
        id:
          type: integer
        recordId:
          type: integer
        title:
          type: string
        order:
          type: integer
          minimum: 1
        visible:
          type: boolean
      additionalProperties: false
    MapDocument:
      type: object
      required:
      - format
      - version
      - id
      - title
      - mapBookmark
      - geoObject
      - symbology
      - minimumZoom
      - maximumZoom
      - zoomToPointInKM
      - worldBaseMap
      - crs
      - layers
      properties:
        format:
          type: string
          const: heurist-map-document
        version:
          type: integer
          const: 1
        id:
          type: integer
          minimum: 1
        title:
          type: string
        mapBookmark:
          $ref: '#/components/schemas/MapBookmark'
        geoObject: {}
        symbology: {}
        minimumZoom:
          type:
          - number
          - 'null'
          description: Existing Heurist minimum-zoom semantic value; not necessarily a map-engine zoom level.
        maximumZoom:
          type:
          - number
          - 'null'
          description: Existing Heurist maximum-zoom semantic value; not necessarily a map-engine zoom level.
        zoomToPointInKM:
          type:
          - number
          - 'null'
        worldBaseMap:
          $ref: '#/components/schemas/TermDescriptor'
        crs:
          $ref: '#/components/schemas/TermDescriptor'
        layers:
          type: array
          items:
            $ref: '#/components/schemas/MapDocumentLayerReference'
      additionalProperties: false
    MapLayerSource:
      type: object
      required:
      - type
      - recordId
      - title
      properties:
        type:
          type: string
          enum:
          - heurist-query
          - record
          - inline-geojson
          - remote-geojson
          - tile
          - image
          - iiif
          - geotiff
        recordId:
          type: integer
          minimum: 1
        title:
          type: string
        query:
          oneOf:
          - type: object
            additionalProperties: true
          - type: string
        url:
          type: string
        fileId:
          type: integer
        tileSchema: {}
        worldFile: {}
        crs:
          $ref: '#/components/schemas/TermDescriptor'
      additionalProperties: true
    MapLayerStyle:
      type: object
      required:
      - type
      - symbol
      - thematic
      properties:
        type:
          type: string
          enum:
          - simple
          - thematic
        symbol: {}
        thematic: {}
      additionalProperties: false
    MapLayer:
      type: object
      required:
      - format
      - version
      - id
      - title
      - description
      - visible
      - selectable
      - source
      - style
      - timeline
      - options
      properties:
        format:
          type: string
          const: heurist-map-layer
        version:
          type: integer
          const: 1
        id:
          type: integer
          minimum: 1
        title:
          type: string
        description:
          type: string
        visible:
          type: boolean
        selectable:
          type: boolean
        source:
          $ref: '#/components/schemas/MapLayerSource'
        style:
          $ref: '#/components/schemas/MapLayerStyle'
        timeline:
          type: object
          required:
          - enabled
          - fields
          properties:
            enabled:
              type: boolean
            fields:
              type: array
              items: {}
          additionalProperties: false
        options:
          type: object
          properties:
            markerClustering:
              type: boolean
            zoomToExtent:
              type: boolean
            minimumZoom:
              type:
              - number
              - 'null'
            maximumZoom:
              type:
              - number
              - 'null'
            popupTemplate:
              type:
              - string
              - 'null'
          additionalProperties: true
      additionalProperties: false
    GeoJsonGeometry:
      type:
      - object
      - 'null'
      description: A GeoJSON geometry object.
      additionalProperties: true
    GeoJsonFeature:
      type: object
      required:
      - type
      - properties
      - geometry
      properties:
        type:
          type: string
          const: Feature
        id: {}
        properties:
          type: object
          additionalProperties: true
        geometry:
          $ref: '#/components/schemas/GeoJsonGeometry'
      additionalProperties: true
    MapResponseMeta:
      type: object
      required:
      - database
      - recordId
      - total
      - offset
      - limit
      properties:
        database:
          type: string
        recordId:
          type:
          - integer
          - 'null'
        total:
          type: integer
          minimum: 0
          description: Number of returned features in the initial implementation.
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
      additionalProperties: false
    MapDataGeoJsonResponse:
      type: object
      required:
      - type
      - features
      properties:
        type:
          type: string
          const: FeatureCollection
        features:
          type: array
          items:
            $ref: '#/components/schemas/GeoJsonFeature'
      additionalProperties: true
    MapGeoJsonResponse:
      type: object
      required:
      - type
      - features
      - meta
      properties:
        type:
          type: string
          const: FeatureCollection
        features:
          type: array
          items:
            $ref: '#/components/schemas/GeoJsonFeature'
        meta:
          $ref: '#/components/schemas/MapResponseMeta'
      additionalProperties: false
    TimelineTimespan:
      type: array
      description: >-
        Timeline span in legacy Heurist order: start, latest-start, earliest-end, end, label, profile-start,
        profile-end, determination, source detail-type ID.
      minItems: 9
      maxItems: 9
      prefixItems:
      - type: string
        description: Earliest/start boundary in Heurist ISO-compatible form.
      - type: string
        description: Latest possible start; empty for a simple date.
      - type: string
        description: Earliest possible end; empty for a simple date.
      - type: string
        description: End/latest boundary in Heurist ISO-compatible form.
      - type: string
        description: Human-readable temporal label.
      - oneOf: [{type: integer}, {type: string}]
        description: Start profile; normally 0 flat, 1 central/circa, 2 slow start/before, 3 slow finish/after.
      - oneOf: [{type: integer}, {type: string}]
        description: End profile; normally 0-3.
      - oneOf: [{type: integer}, {type: string}]
        description: Determination code; 0 unknown, 1 attested, 2 conjecture, 3 measurement.
      - type: integer
        minimum: 1
        description: Source detail-type ID.
    TimelineRecord:
      allOf:
      - $ref: '#/components/schemas/Record'
      - type: object
        required: [when]
        properties:
          when:
            type: array
            items:
              $ref: '#/components/schemas/TimelineTimespan'
    TimelineResponse:
      type: object
      required: [records, meta, pagination]
      properties:
        records:
          type: array
          description: Ordinary record envelopes in top-query order, each augmented with when.
          items:
            $ref: '#/components/schemas/TimelineRecord'
        meta:
          $ref: '#/components/schemas/RecordsMeta'
        pagination:
          $ref: '#/components/schemas/Pagination'
      additionalProperties: false
  responses:
    ApiBadRequest:
      description: Invalid request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    ApiUnauthorized:
      description: Not logged in
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    ApiForbidden:
      description: Not allowed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    ApiNotFound:
      description: Not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication is required or the bearer token is invalid
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Requested item was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MethodNotAllowed:
      description: HTTP method is not supported
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
