  /{database}/termlinks:
    get:
      tags:
        - Database structure
      operationId: listTermLinks
      summary: Retrieve term parent-link relationships
      description: >-
        Returns rows from `defTermsLinks`. Each item preserves the parent and term IDs. Links may represent
        either the explicit `trm_ParentTermID` hierarchy or an additional implicit vocabulary/parent
        association.


        With tree=true (or 1), supply exactly one of termId or parentId. termId accepts one ID or up to 1000
        unique comma-separated IDs and returns only the requested terms and their real ancestor paths, grouped
        by vocabulary. Real parents follow defTerms.trm_ParentTermID, excluding reference-only ancestors.
        parentId accepts one ID and returns its full subtree, including defTermsLinks references. Each node
        contains id, label, parentId (the real parent, null for a vocabulary), and children. Missing IDs are
        omitted. A missing parent definition makes the highest available ancestor a partial root. Reference
        cycles are skipped; corrupt real-parent cycles or trees exceeding 128 levels or 100000 node occurrences
        return an error, never a silently truncated tree. limit and offset paginate root trees only; descendants
        are never paginated. Siblings and roots are sorted by label. Without tree, existing direct-link behavior
        is unchanged.
      security: []
      parameters:
        - $ref: '#/components/parameters/Database'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: parentId
          in: query
          description: Direct parent filter, or subtree root when tree=true.
          schema:
            type: integer
            minimum: 1
        - name: termId
          in: query
          description: >-
            Single term ID in direct-link mode. With tree=true, one ID or a comma-separated list of IDs;
            repeated termId[] query parameters are also accepted.
          schema:
            oneOf:
              - type: integer
                minimum: 1
              - type: string
                pattern: ^[1-9][0-9]*(,[1-9][0-9]*)*$
        - name: tree
          in: query
          description: Return labeled hierarchy trees instead of direct term-link pairs. Accepts true/false or 1/0.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Term links
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TermLinkSearchResponse'
                  - $ref: '#/components/schemas/TermTreeSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
