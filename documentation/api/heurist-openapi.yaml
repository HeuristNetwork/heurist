components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT supplied in the Authorization header. Existing Heurist browser sessions may also be recognised.
  parameters:
    Database:
      name: database
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      example: my_database
    DatabaseName:
      name: databaseName
      in: path
      required: true
      description: Heurist database name as returned in sys_Database.
      schema:
        type: string
        minLength: 1
      example: my_database
    DatabaseDetails:
      name: details
      in: query
      description: Return only database names with id, or full database registration information with full.
      schema:
        type: string
        enum:
        - id
        - full
        default: id
    RegisteredDatabaseIdFilter:
      name: sys_dbRegisteredID
      in: query
      description: Filter by registered database ID. Comparison syntax such as >0 is accepted.
      schema:
        type: string
      example: '>0'
    RecordId:
      name: recordId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    RecordTypeId:
      name: recordTypeId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    FieldId:
      name: fieldId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    TermId:
      name: termId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    IiifIdentifier:
      name: identifier
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 1000
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Details:
      name: details
      in: query
      description: Entity-specific response projection. Existing DbDefXXX modes remain available; commonly used
        values include id, name, list, full, raw and structure where supported.
      schema:
        type: string
  schemas:
    Error:
      type: object
      required:
      - status
      - error
      - message
      properties:
        status:
          type: integer
          description: HTTP response status code.
          example: 404
        error:
          type: string
          description: Heurist API response status constant defined in consts.php.
          enum:
          - invalid
          - notfound
          - denied
          - blocked
          - error
          - database
          - syscfg
          - system
          - network
          - unknown
          example: notfound
        message:
          type: string
          example: Definition not found
      additionalProperties: false
    DatabaseDefinition:
      type: object
      required:
      - sys_Database
      properties:
        sys_Database:
          type: string
          description: Database name used in API path segments.
        sys_dbRegisteredID:
          type: integer
          description: Registered database identifier.
        sys_dbName:
          type: string
          description: Display name of the database.
        sys_dbRights:
          type: string
        sys_dbDescription:
          type: string
      additionalProperties: true
    DatabaseMeta:
      type: object
      required:
      - database
      - entity
      properties:
        database:
          type: 'null'
          description: Always null because database listing is a server-level request.
        entity:
          type: string
          const: databases
      additionalProperties: false
    DatabaseSearchResponse:
      type: object
      required:
      - items
      - meta
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DatabaseDefinition'
        meta:
          $ref: '#/components/schemas/DatabaseMeta'
        pagination:
          $ref: '#/components/schemas/Pagination'
      additionalProperties: false
    Definition:
      type: object
      additionalProperties: true
    DefinitionMeta:
      type: object
      required:
      - database
      - entity
      properties:
        database:
          type: string
        entity:
          type: string
          enum:
          - rectypes
          - fields
          - terms
          - termlinks
          - recstructure
        recordTypeId:
          type: integer
          minimum: 1
      additionalProperties: false
    Pagination:
      type: object
      required:
      - total
      - offset
      - limit
      - self
      - next
      properties:
        total:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 1000
        self:
          type: string
          format: uri
        next:
          oneOf:
          - type: string
            format: uri
          - type: 'null'
      additionalProperties: false
    DefinitionCollection:
      type: object
      required:
      - items
      - meta
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Definition'
        meta:
          $ref: '#/components/schemas/DefinitionMeta'
        pagination:
          $ref: '#/components/schemas/Pagination'
      additionalProperties: false
    TermLink:
      type: object
      required:
      - trl_ParentID
      - trl_TermID
      properties:
        trl_ParentID:
          type: integer
          minimum: 1
          description: Parent term or vocabulary ID stored in `defTermsLinks`.
        trl_TermID:
          type: integer
          minimum: 1
          description: Linked term ID stored in `defTermsLinks`.
      additionalProperties: false
    TermLinkMeta:
      type: object
      required:
      - database
      - entity
      properties:
        database:
          type: string
        entity:
          type: string
          const: termlinks
      additionalProperties: false
    TermLinkSearchResponse:
      type: object
      required:
      - items
      - meta
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TermLink'
        meta:
          $ref: '#/components/schemas/TermLinkMeta'
        pagination:
          $ref: '#/components/schemas/Pagination'
      additionalProperties: false
    Record:
      type: object
      description: A Heurist record object. By default it contains rec_ID, rec_RecTypeID, rec_Title and all visible
        details. The fields parameter can reduce the returned properties.
      properties:
        rec_ID:
          type: string
        rec_RecTypeID:
          type: string
        rec_Title:
          oneOf:
          - type: string
          - type: 'null'
        details:
          $ref: '#/components/schemas/RecordDetails'
      additionalProperties: true
    RecordSearchResponse:
      type: object
      required:
      - records
      - meta
      - pagination
      properties:
        records:
          type: array
          description: Record objects, or record IDs when detail=ids.
          items:
            oneOf:
            - $ref: '#/components/schemas/Record'
            - type: integer
            - type: string
        meta:
          $ref: '#/components/schemas/RecordsMeta'
        pagination:
          $ref: '#/components/schemas/Pagination'
      additionalProperties: false
    RecordItemMeta:
      type: object
      required:
      - database
      - entity
      - self
      - fields
      properties:
        database:
          type: string
        entity:
          type: string
          const: records
        self:
          type: string
          format: uri
        fields:
          $ref: '#/components/schemas/RecordFieldsMeta'
      additionalProperties: false
    RecordItemResponse:
      type: object
      required:
      - records
      - meta
      properties:
        records:
          type: array
          maxItems: 1
          description: One record object, one record ID when detail=ids, or an empty array when missing or inaccessible.
          items:
            oneOf:
            - $ref: '#/components/schemas/Record'
            - type: integer
            - type: string
        meta:
          $ref: '#/components/schemas/RecordItemMeta'
      additionalProperties: false
    SessionLoginRequest:
      type: object
      required:
      - login
      - password
      properties:
        login:
          type: string
        password:
          type: string
          format: password
    IiifResource:
      type: object
      additionalProperties: true
    RecordDetails:
      type: object
      description: Map keyed by detail type ID; each value is a map keyed by detail row ID.
      additionalProperties:
        type: object
