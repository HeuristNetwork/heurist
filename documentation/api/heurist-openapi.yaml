  /{database}/records:
    get:
      tags:
      - Records
      operationId: searchRecords
      summary: Search records
      description: Anonymous requests return only publicly visible records. The response keeps the established records
        array and record detail structure, and adds metadata and pagination. A missing or inaccessible record returns
        an empty records array.
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - name: q
        in: query
        schema:
          type: string
        description: Heurist search expression.
      - name: w
        in: query
        schema:
          type: string
        description: Heurist search mode/domain.
      - name: ids
        in: query
        schema:
          type: string
        example: 123,456
        description: Comma-separated record identifiers.
      - name: fields
        in: query
        schema:
          type: string
        description: Comma-separated record header fields and/or numeric detail type IDs. rec_ID and rec_RecTypeID
          are always included in normal object mode. When omitted, rec_Title and all details are also returned.
          An explicit fields=rec_ID still returns record objects.
      - name: detail
        in: query
        schema:
          type: string
          enum:
          - ids
        description: Set to ids for an ID-only records array. This mode takes precedence over and ignores fields.
      responses:
        '200':
          description: Records response with metadata and pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
  /{database}/records/{recordId}:
    get:
      tags:
      - Records
      operationId: getRecord
      summary: Retrieve one record
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/RecordId'
      - name: fields
        in: query
        schema:
          type: string
        description: Comma-separated record header fields and/or numeric detail type IDs. rec_ID and rec_RecTypeID
          are always included in normal object mode. When omitted, rec_Title and all details are also returned.
          An explicit fields=rec_ID still returns record objects.
      - name: detail
        in: query
        schema:
          type: string
          enum:
          - ids
        description: Set to ids for an ID-only records array. This mode takes precedence over and ignores fields.
      responses:
        '200':
          description: Records response for one requested record. Missing or inaccessible records return an empty
            records array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Anonymous requests return only publicly visible records. The response keeps the established records
        array and record detail structure, and adds metadata and pagination. A missing or inaccessible record returns
        an empty records array.
