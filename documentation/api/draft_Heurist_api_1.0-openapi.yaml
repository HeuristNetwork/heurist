openapi: 3.1.0

info:
  title: Heurist Read API
  version: 1.0.0-draft
  summary: Read-only access to Heurist records, database definitions and IIIF resources
  description: |
    This specification describes the public, read-only portion of the Heurist HTTP API.

    It intentionally excludes database creation, structural modification and record
    update operations. Existing abbreviated routes remain available for backward
    compatibility, but the descriptive route names are the preferred public interface.

    This is a draft contract for the current h7dev implementation. Response schemas
    are deliberately permissive where the existing controllers return database-specific
    or format-dependent JSON.

servers:
  - url: https://{host}/api
    description: A Heurist installation
    variables:
      host:
        default: heurist.huma-num.fr
        description: Host name of the Heurist server

tags:
  - name: Records
    description: Search for and retrieve records
  - name: Database structure
    description: Retrieve record types, fields, terms and record structures
  - name: IIIF
    description: Retrieve IIIF Presentation API resources
  - name: Legacy aliases
    description: Backward-compatible abbreviated routes; not recommended for new clients

paths:
  /{database}/records:
    get:
      tags: [Records]
      operationId: searchRecords
      summary: Search and retrieve records
      description: |
        Returns records visible to the current user. Anonymous requests are permitted,
        but only records that are publicly accessible will be returned.

        Heurist supports additional search and output parameters beyond the common
        parameters documented here. Those parameters should be documented separately
        once their stable public contract has been confirmed.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Database'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: q
          in: query
          description: Heurist search expression or free-text query, according to the selected search mode.
          schema:
            type: string
        - name: w
          in: query
          description: Search domain or search mode used by the Heurist record-search controller.
          schema:
            type: string
        - name: rt
          in: query
          description: Restrict results to one or more record type identifiers.
          schema:
            oneOf:
              - type: integer
              - type: string
        - name: ids
          in: query
          description: Restrict results to one or more record identifiers.
          schema:
            type: string
          example: "123,456,789"
        - name: sort
          in: query
          description: Sort expression accepted by the Heurist record-search controller.
          schema:
            type: string
        - name: format
          in: query
          description: Requested output format.
          schema:
            type: string
            default: json
        - name: detail
          in: query
          description: Controls the amount or representation of record detail returned.
          schema:
            type: string
      responses:
        '200':
          description: Record search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'

  /{database}/records/{recordId}:
    get:
      tags: [Records]
      operationId: getRecord
      summary: Retrieve a record
      description: |
        Retrieves a record if it is visible to the current user. Anonymous access is
        permitted for publicly accessible records.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Database'
        - $ref: '#/components/parameters/RecordId'
        - name: format
          in: query
          description: Requested output format.
          schema:
            type: string
            default: json
        - name: detail
          in: query
          description: Controls the amount or representation of record detail returned.
          schema:
            type: string
      responses:
        '200':
          description: The requested record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'

  /{database}/rectypes:
    get:
      tags: [Database structure]
      operationId: listRecordTypes
      summary: Retrieve record type definitions
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Database'
        - $ref: '#/components/parameters/Limit'
        - name: id
          in: query
          description: Restrict the response to a record type identifier.
          schema:
            type: integer
      responses:
        '200':
          description: Record type definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitySearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /{database}/rectypes/{recordTypeId}:
    get:
      tags: [Database structure]
      operationId: getRecordType
      summary: Retrieve a record type definition
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Database'
        - $ref: '#/components/parameters/RecordTypeId'
      responses:
        '200':
          description: Record type definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /{database}/fields:
    get:
      tags: [Database structure]
      operationId: listFields
      summary: Retrieve field definitions
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Database'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Field definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitySearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /{database}/fields/{fieldId}:
    get:
      tags: [Database structure]
      operationId: getField
      summary: Retrieve a field definition
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Database'
        - $ref: '#/components/parameters/FieldId'
      responses:
        '200':
          description: Field definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /{database}/terms:
    get:
      tags: [Database structure]
      operationId: listTerms
      summary: Retrieve vocabulary terms
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Database'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Vocabulary terms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitySearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /{database}/terms/{termId}:
    get:
      tags: [Database structure]
      operationId: getTerm
      summary: Retrieve a vocabulary term
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Database'
        - $ref: '#/components/parameters/TermId'
      responses:
        '200':
          description: Vocabulary term
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /{database}/record-structure/{recordTypeId}:
    get:
      tags: [Database structure]
      operationId: getRecordStructure
      summary: Retrieve the field structure for a record type
      description: |
        Preferred descriptive route proposed for the public API. It must be added as
        an alias for the existing `rst` resource before this path is deployed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Database'
        - $ref: '#/components/parameters/RecordTypeId'
      responses:
        '200':
          description: Record structure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /{database}/iiif/manifest/{identifier}:
    get:
      tags: [IIIF]
      operationId: getIiifManifest
      summary: Retrieve an IIIF Presentation 3 manifest
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/Database'
        - $ref: '#/components/parameters/IiifIdentifier'
      responses:
        '200':
          description: IIIF Presentation 3 Manifest
          content:
            application/ld+json:
              schema:
                type: object
                additionalProperties: true
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'

  /{database}/iiif/canvas/{identifier}:
    get:
      tags: [IIIF]
      operationId: getIiifCanvas
      summary: Retrieve an IIIF Presentation 3 canvas
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/Database'
        - $ref: '#/components/parameters/IiifIdentifier'
      responses:
        '200':
          description: IIIF Presentation 3 Canvas
          content:
            application/ld+json:
              schema:
                type: object
                additionalProperties: true
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'

  /{database}/iiif/annotations/{identifier}:
    get:
      tags: [IIIF]
      operationId: getIiifAnnotationPage
      summary: Retrieve the IIIF AnnotationPage associated with a canvas or file
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/Database'
        - $ref: '#/components/parameters/IiifIdentifier'
      responses:
        '200':
          description: IIIF AnnotationPage
          content:
            application/ld+json:
              schema:
                type: object
                additionalProperties: true
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'

  /{database}/rty:
    get:
      deprecated: true
      tags: [Legacy aliases]
      operationId: listRecordTypesLegacy
      summary: Legacy alias for record type definitions
      description: Use `/{database}/rectypes` for new integrations.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Database'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Record type definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitySearchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /{database}/dty:
    get:
      deprecated: true
      tags: [Legacy aliases]
      operationId: listFieldsLegacy
      summary: Legacy alias for field definitions
      description: Use `/{database}/fields` for new integrations.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Database'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Field definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitySearchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /{database}/trm:
    get:
      deprecated: true
      tags: [Legacy aliases]
      operationId: listTermsLegacy
      summary: Legacy alias for vocabulary terms
      description: Use `/{database}/terms` for new integrations.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Database'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Vocabulary terms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitySearchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /{database}/rst/{recordTypeId}:
    get:
      deprecated: true
      tags: [Legacy aliases]
      operationId: getRecordStructureLegacy
      summary: Legacy route for a record type structure
      description: |
        Existing route. Retain for backward compatibility. Add and document
        `/{database}/record-structure/{recordTypeId}` as its descriptive alias.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Database'
        - $ref: '#/components/parameters/RecordTypeId'
      responses:
        '200':
          description: Record structure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT supplied in the `Authorization` header. The current implementation
        may also recognise an authenticated Heurist browser session, but cookie
        authentication is not recommended as the public integration contract.

  parameters:
    Database:
      name: database
      in: path
      required: true
      description: Heurist database name.
      schema:
        type: string
        minLength: 1
      example: my_database

    RecordId:
      name: recordId
      in: path
      required: true
      description: Numeric Heurist record identifier.
      schema:
        type: integer
        minimum: 1

    RecordTypeId:
      name: recordTypeId
      in: path
      required: true
      description: Numeric record type identifier.
      schema:
        type: integer
        minimum: 1

    FieldId:
      name: fieldId
      in: path
      required: true
      description: Numeric field/detail type identifier.
      schema:
        type: integer
        minimum: 1

    TermId:
      name: termId
      in: path
      required: true
      description: Numeric vocabulary term identifier.
      schema:
        type: integer
        minimum: 1

    IiifIdentifier:
      name: identifier
      in: path
      required: true
      description: Record identifier or obfuscated file identifier accepted by the IIIF controller.
      schema:
        type: string
        minLength: 1

    Limit:
      name: limit
      in: query
      description: |
        Maximum number of results. The current controller defaults invalid,
        absent or out-of-range values to 1000.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 1000

    Offset:
      name: offset
      in: query
      description: Number of matching results to skip before returning results.
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    BadRequest:
      description: Invalid request or invalid API route
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: invalid
            message: API Not Found

    Unauthorized:
      description: Authentication is required or the supplied token is invalid
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer authentication challenge
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: invalid
            message: Unauthorized

    NotFound:
      description: The database or requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    MethodNotAllowed:
      description: The HTTP method is not supported for this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: invalid
            message: Method Not Implemented

    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          const: invalid
        message:
          type: string
      additionalProperties: true

    Record:
      type: object
      description: |
        A Heurist record. Exact properties depend on the requested output format,
        record type and `detail` setting.
      additionalProperties: true

    RecordResponse:
      description: |
        Current record output may be a record object or an existing Heurist response
        envelope, depending on output options. Tighten this schema after capturing
        representative responses from the deployed API.
      oneOf:
        - $ref: '#/components/schemas/Record'
        - type: object
          additionalProperties: true
        - type: array
          items:
            $ref: '#/components/schemas/Record'

    RecordSearchResponse:
      description: |
        Search result returned by `record_output.php`. This permissive schema is
        intentional until the stable JSON response shapes and format options are
        enumerated.
      oneOf:
        - type: array
          items:
            $ref: '#/components/schemas/Record'
        - type: object
          additionalProperties: true

    Entity:
      type: object
      description: A Heurist database-definition entity.
      additionalProperties: true

    EntityResponse:
      description: Single entity or an existing entityScrud response envelope.
      oneOf:
        - $ref: '#/components/schemas/Entity'
        - type: object
          additionalProperties: true

    EntitySearchResponse:
      description: Entity list or an existing entityScrud response envelope.
      oneOf:
        - type: array
          items:
            $ref: '#/components/schemas/Entity'
        - type: object
          additionalProperties: true
